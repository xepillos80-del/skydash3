<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>설악산 산사 · 실사풍 3D 산사</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:#0a0f18; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;
  }
  canvas#scene{
    position:fixed; inset:0; display:block;
    width:100%; height:100%;
    touch-action:none; outline:none;
  }
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:3;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 42%, rgba(0,0,0,.30) 100%);
  }
  #hud{
    position:fixed; z-index:5; pointer-events:none;
    left:calc(18px + env(safe-area-inset-left));
    top:calc(16px + env(safe-area-inset-top));
    color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.55);
  }
  #hud h1{
    margin:0; font-size:18px; font-weight:600;
    letter-spacing:.26em; opacity:.96;
  }
  #hud p{
    margin:7px 0 0; font-size:11.5px; letter-spacing:.02em;
    opacity:.72; transition:opacity 1.6s ease;
  }
  #hud p.dim{ opacity:0; }
  #bar{
    position:fixed; z-index:6;
    left:50%; transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex; align-items:center; flex-wrap:wrap; justify-content:center;
    gap:6px;
    padding:6px; border-radius:26px;
    background:rgba(16,20,27,.42);
    -webkit-backdrop-filter:blur(18px) saturate(1.5);
    backdrop-filter:blur(18px) saturate(1.5);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 12px 34px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.12);
    max-width:calc(100vw - 20px);
  }
  .seg{
    display:flex; gap:2px; padding:2px; border-radius:999px;
    background:rgba(255,255,255,.08);
  }
  #bar button{
    -webkit-appearance:none; appearance:none; border:0; cursor:pointer;
    background:transparent; color:rgba(255,255,255,.76);
    font-family:inherit; font-size:12.5px; letter-spacing:.01em;
    padding:8px 12px; border-radius:999px; white-space:nowrap;
    transition:background .28s ease, color .28s ease, transform .12s ease;
  }
  #bar button.on{ background:rgba(255,255,255,.92); color:#161a20; }
  #bar button:active{ transform:scale(.95); }
  #loader{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, #1a2534 0%, #0a0f18 70%);
    color:rgba(255,255,255,.8); font-size:12.5px; letter-spacing:.14em;
    transition:opacity .8s ease; pointer-events:none;
  }
  #loader p{ margin:16px 0 0; }
  #loader.gone{ opacity:0; }
  .spin{
    width:26px; height:26px; border-radius:50%;
    border:2px solid rgba(255,255,255,.16);
    border-top-color:rgba(255,255,255,.85);
    animation:sp 1.05s linear infinite;
  }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  #err{
    display:none; position:fixed; z-index:30;
    left:12px; right:12px; bottom:84px; padding:10px 12px;
    border-radius:12px; background:rgba(120,20,20,.86);
    color:#fff; font-size:11px; line-height:1.5; word-break:break-all;
  }
  #hint{
    position:fixed; z-index:5; pointer-events:none;
    left:50%; transform:translateX(-50%);
    bottom:calc(112px + env(safe-area-inset-bottom));
    color:rgba(255,255,255,.82); font-size:11.5px; letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.6); white-space:nowrap;
    opacity:0; transition:opacity .9s ease; text-align:center;
  }
  #hint.show{ opacity:1; }
  @media (max-width:380px){
    #bar button{ padding:7px 9px; font-size:11.5px; }
    #hud h1{ font-size:16px; }
    #bar{ gap:5px; padding:5px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>

<div id="hud">
  <h1>설악산 산사</h1>
  <p>터치해 돌려 보세요 · 두 손가락으로 확대 · 문 앞에서 더 들어가면 법당 안으로</p>
</div>

<div id="hint"></div>

<div id="bar">
  <div class="seg">
    <button data-tod="day" class="on">낮</button>
    <button data-tod="sunset">노을</button>
    <button data-tod="night">밤</button>
  </div>
  <button id="insideBtn">🚪 법당 안</button>
  <button id="musicBtn">🎵 음악</button>
  <button id="snowBtn" class="on">❄ 눈 그치기</button>
  <button id="resetBtn">⟲ 시점</button>
</div>

<div id="loader">
  <div class="spin"></div>
  <p>산사를 짓고 있어요…</p>
</div>
<div id="err"></div>

<noscript>
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:#0a0f18;font-size:14px">
    자바스크립트를 켜야 3D 산사를 볼 수 있어요.
  </div>
</noscript>

<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('err');
    if (el) {
      el.style.display = 'block';
      el.textContent = '오류: ' + (e && e.message ? e.message : '알 수 없는 오류');
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var el = document.getElementById('err');
    if (el) {
      el.style.display = 'block';
      el.textContent = '오류: ' + (e && e.reason ? e.reason : '모듈을 불러오지 못했어요');
    }
  });
</script>

<script>
  setTimeout(function () {
    var l = document.getElementById('loader');
    if (l && !l.classList.contains('gone')) {
      var p = l.querySelector('p');
      if (p) p.textContent = '3D 라이브러리를 불러오는 중이에요 · 인터넷 연결을 확인해 주세요';
    }
  }, 14000);
</script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/+esm';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js/+esm';

/* ==================================================================
   설악산 산사 · 실사풍 3D 산사
   단일 HTML · Three.js (CDN) · 절차적 텍스처
   ================================================================== */

const TAU = Math.PI * 2;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
  return s - Math.floor(s);
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, oct) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    s += vnoise(x * f, y * f) * amp;
    norm += amp;
    amp *= 0.5;
    f *= 2.03;
  }
  return s / norm;
}
function sdBox(x, z, hx, hz) {
  const dx = Math.abs(x) - hx, dz = Math.abs(z) - hz;
  const ax = Math.max(dx, 0), az = Math.max(dz, 0);
  return Math.sqrt(ax * ax + az * az) + Math.min(Math.max(dx, dz), 0);
}
function mixInto(out, a, b, t) { out.copy(a).lerp(b, t); }

/* ---------------- renderer / scene / camera ---------------- */

const canvasEl = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({
  canvas: canvasEl,
  antialias: true,
  powerPreference: 'high-performance'
});
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
if ('outputColorSpace' in renderer && THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
const MAXANISO = Math.max(1, Math.min(8, renderer.capabilities.getMaxAnisotropy()));

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xc6d6e2, 0.0026);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.4, 3000);
const HOME_POS = new THREE.Vector3(11.5, 10.5, 28.0);
const HOME_TGT = new THREE.Vector3(0, 5.8, -8.0);
const HOME_OFF = new THREE.Vector3().subVectors(HOME_POS, HOME_TGT);
const HOME_CUR = new THREE.Vector3();

/* 넓은 화면에서는 조금 물러나 산사 전체가 들어오게 한다 */
function homeScale() {
  const a = window.innerWidth / Math.max(1, window.innerHeight);
  return clamp(1 + (a - 0.55) * 0.62, 1, 1.62);
}
function homeVec() {
  return HOME_CUR.copy(HOME_TGT).addScaledVector(HOME_OFF, homeScale());
}

/* 세로 화면에서도 대웅전이 프레임에 꽉 차도록 수평 화각 기준으로 맞춘다 */
function fitCamera() {
  const w = window.innerWidth, h = Math.max(1, window.innerHeight);
  const aspect = Math.max(0.3, w / h);
  const hFov = 42 * Math.PI / 180;
  let vFov = 2 * Math.atan(Math.tan(hFov / 2) / aspect);
  const maxV = 72 * Math.PI / 180;
  if (vFov > maxV) vFov = maxV;
  camera.fov = vFov * 180 / Math.PI;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
}
fitCamera();
camera.position.copy(homeVec());

const controls = new OrbitControls(camera, canvasEl);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.rotateSpeed = 0.62;
controls.zoomSpeed = 0.75;
controls.minDistance = 0.8;
controls.maxDistance = 105;
controls.minPolarAngle = 0.16;
controls.maxPolarAngle = Math.PI * 0.492;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_ROTATE };
controls.addEventListener('start', function () { controls.autoRotate = false; });

/* ---------------- canvas texture helpers ---------------- */

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function ctex(canvas, rx, ry, srgb) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx || 1, ry || 1);
  t.anisotropy = MAXANISO;
  t.colorSpace = (srgb === false) ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  return t;
}
function roundRectPath(g, x, y, w, h, r) {
  const rr = Math.min(r, w * 0.5, h * 0.5);
  g.beginPath();
  g.moveTo(x + rr, y);
  g.lineTo(x + w - rr, y);
  g.quadraticCurveTo(x + w, y, x + w, y + rr);
  g.lineTo(x + w, y + h - rr);
  g.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  g.lineTo(x + rr, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - rr);
  g.lineTo(x, y + rr);
  g.quadraticCurveTo(x, y, x + rr, y);
  g.closePath();
}

/* 화강암 — 밝은 회색 바탕 + 석영/장석 결정 + 흑운모 + 잔균열 */
function texGranite() {
  const r = rng(1101);
  const c = makeCanvas(512, 512);
  const g = c.getContext('2d');
  g.fillStyle = '#a2a19b';
  g.fillRect(0, 0, 512, 512);

  for (let i = 0; i < 80; i++) {
    const x = r() * 512, y = r() * 512, rad = 34 + r() * 96;
    const v = 146 + Math.floor(r() * 34);
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, 'rgba(' + v + ',' + v + ',' + (v - 7) + ',0.22)');
    gr.addColorStop(1, 'rgba(' + v + ',' + v + ',' + (v - 7) + ',0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, rad, 0, TAU); g.fill();
  }

  for (let i = 0; i < 5400; i++) {
    const x = r() * 512, y = r() * 512;
    const rad = 0.6 + r() * r() * 2.9;
    const k = r();
    let v, a;
    if (k < 0.40) { v = 178 + r() * 66; a = 0.22 + r() * 0.40; }
    else if (k < 0.82) { v = 88 + r() * 46; a = 0.18 + r() * 0.34; }
    else { v = 212 + r() * 40; a = 0.26 + r() * 0.46; }
    g.fillStyle = 'rgba(' + Math.round(v) + ',' + Math.round(v * 0.99) + ',' + Math.round(v * 0.94) + ',' + a.toFixed(2) + ')';
    g.beginPath(); g.arc(x, y, rad, 0, TAU); g.fill();
  }

  g.strokeStyle = 'rgba(66,66,62,0.14)';
  for (let i = 0; i < 14; i++) {
    g.lineWidth = 0.6 + r() * 1.4;
    let x = r() * 512, y = r() * 512;
    g.beginPath();
    g.moveTo(x, y);
    for (let s = 0; s < 9; s++) {
      x += (r() - 0.5) * 78;
      y += (r() - 0.5) * 78;
      g.lineTo(x, y);
    }
    g.stroke();
  }
  return c;
}

/* 기와 — 이어지는 수키와 골 + 회색 철청색 번짐 */
function texRoofTile() {
  const r = rng(2203);
  const c = makeCanvas(512, 512);
  const g = c.getContext('2d');
  g.fillStyle = '#3b4046';
  g.fillRect(0, 0, 512, 512);

  const cols = 8, w = 512 / cols;
  for (let i = 0; i < cols; i++) {
    const x0 = i * w;
    const gr = g.createLinearGradient(x0, 0, x0 + w, 0);
    gr.addColorStop(0.00, '#20242a');
    gr.addColorStop(0.14, '#5d656e');
    gr.addColorStop(0.30, '#7c858e');
    gr.addColorStop(0.46, '#59616a');
    gr.addColorStop(0.64, '#2c3137');
    gr.addColorStop(0.82, '#1a1e22');
    gr.addColorStop(1.00, '#333940');
    g.fillStyle = gr;
    g.fillRect(x0, 0, w, 512);
  }

  for (let y = 0; y < 512; y += 64) {
    g.fillStyle = 'rgba(12,14,17,0.55)';
    g.fillRect(0, y, 512, 4);
    g.fillStyle = 'rgba(158,168,180,0.14)';
    g.fillRect(0, y + 4, 512, 2);
    g.fillStyle = 'rgba(12,14,17,0.16)';
    g.fillRect(0, y + 40, 512, 12);
  }

  for (let i = 0; i < 300; i++) {
    const x = r() * 512, y = r() * 512, rad = 3 + r() * 30;
    const v = 20 + Math.floor(r() * 46);
    g.fillStyle = 'rgba(' + v + ',' + (v + 4) + ',' + (v + 8) + ',' + (0.05 + r() * 0.12).toFixed(2) + ')';
    g.beginPath(); g.arc(x, y, rad, 0, TAU); g.fill();
  }
  return c;
}

/* 목재 — 세로 결 + 옹이 */
function texWood(seed, base) {
  const r = rng(seed || 3301);
  const c = makeCanvas(256, 512);
  const g = c.getContext('2d');
  g.fillStyle = base || '#5b3327';
  g.fillRect(0, 0, 256, 512);

  for (let i = 0; i < 140; i++) {
    const x = r() * 256, w = 0.7 + r() * 4.6;
    g.fillStyle = r() < 0.52 ? 'rgba(38,20,14,0.20)' : 'rgba(146,92,60,0.15)';
    g.fillRect(x, 0, w, 512);
  }
  for (let i = 0; i < 3; i++) {
    const x = 30 + r() * 196, y = r() * 512;
    g.strokeStyle = 'rgba(40,22,14,0.14)';
    for (let k = 6; k > 0; k--) {
      g.lineWidth = 1.6;
      g.beginPath();
      g.ellipse(x, y, k * 4.6, k * 10, 0, 0, TAU);
      g.stroke();
    }
  }
  return c;
}

/* 단청 — 진녹색 바탕 + 연화 문양 띠 */
function texDancheong() {
  const c = makeCanvas(512, 128);
  const g = c.getContext('2d');
  g.fillStyle = '#1e3b32';
  g.fillRect(0, 0, 512, 128);

  g.fillStyle = '#7d2b22'; g.fillRect(0, 0, 512, 13);
  g.fillStyle = '#d9caa7'; g.fillRect(0, 15, 512, 4);
  g.fillStyle = '#274a63'; g.fillRect(0, 107, 512, 21);
  g.fillStyle = '#d9caa7'; g.fillRect(0, 103, 512, 4);

  for (let i = 0; i < 16; i++) {
    const x = i * 32 + 16;
    g.fillStyle = (i % 2) ? '#b0472f' : '#e2d5af';
    g.beginPath(); g.arc(x, 62, 15, 0, TAU); g.fill();
    g.fillStyle = '#1e3b32';
    g.beginPath(); g.arc(x, 62, 8, 0, TAU); g.fill();
    g.fillStyle = (i % 2) ? '#e2d5af' : '#b0472f';
    g.beginPath(); g.arc(x, 62, 3.4, 0, TAU); g.fill();
  }
  return c;
}

/* 회벽 */
function texPlaster() {
  const r = rng(4409);
  const c = makeCanvas(256, 256);
  const g = c.getContext('2d');
  g.fillStyle = '#eae3d2';
  g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1000; i++) {
    const x = r() * 256, y = r() * 256, rad = 2 + r() * 20;
    const v = 196 + Math.floor(r() * 40);
    g.fillStyle = 'rgba(' + v + ',' + (v - 8) + ',' + (v - 26) + ',0.10)';
    g.beginPath(); g.arc(x, y, rad, 0, TAU); g.fill();
  }
  g.strokeStyle = 'rgba(150,140,120,0.22)';
  for (let i = 0; i < 7; i++) {
    g.lineWidth = 0.8;
    let x = r() * 256, y = r() * 256;
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < 5; s++) { x += (r() - 0.5) * 40; y += (r() - 0.5) * 40; g.lineTo(x, y); }
    g.stroke();
  }
  return c;
}

/* 창호지 + 문살 */
function texLattice() {
  const r = rng(5501);
  const c = makeCanvas(512, 512);
  const g = c.getContext('2d');
  g.fillStyle = '#f6e9c9';
  g.fillRect(0, 0, 512, 512);

  for (let i = 0; i < 500; i++) {
    const x = r() * 512, y = r() * 512, rad = 2 + r() * 26;
    const v = 226 + Math.floor(r() * 28);
    g.fillStyle = 'rgba(' + v + ',' + (v - 10) + ',' + (v - 44) + ',0.14)';
    g.beginPath(); g.arc(x, y, rad, 0, TAU); g.fill();
  }

  g.strokeStyle = '#5a2e20';
  g.lineWidth = 24;
  g.strokeRect(12, 12, 488, 488);

  g.lineWidth = 8;
  g.strokeStyle = '#6b3a28';
  for (let i = 1; i < 8; i++) {
    const p = i * 64;
    g.beginPath(); g.moveTo(p, 24); g.lineTo(p, 488); g.stroke();
    g.beginPath(); g.moveTo(24, p); g.lineTo(488, p); g.stroke();
  }
  g.lineWidth = 3;
  g.strokeStyle = 'rgba(84,44,30,0.55)';
  for (let i = 0; i < 8; i++) {
    const p = i * 64 + 32;
    g.beginPath(); g.moveTo(p, 24); g.lineTo(p, 488); g.stroke();
    g.beginPath(); g.moveTo(24, p); g.lineTo(488, p); g.stroke();
  }
  return c;
}

/* 돌담 — 막쌓기 화강암 + 이끼 */
function texStoneWall() {
  const r = rng(6607);
  const c = makeCanvas(512, 512);
  const g = c.getContext('2d');
  g.fillStyle = '#4a443a';
  g.fillRect(0, 0, 512, 512);

  let y = 0;
  while (y < 512) {
    const h = 42 + r() * 28;
    let x = -r() * 46;
    while (x < 512) {
      const w = 52 + r() * 76;
      const v = 112 + Math.floor(r() * 52);
      g.fillStyle = 'rgb(' + v + ',' + (v - 5) + ',' + (v - 16) + ')';

  return c;
}

  const t = tex.clone();

  t.anisotropy = MAXANISO;
  return t;
}

function makeRidgeLayer(radius, height, seed, colorHex) {
  const segs = 280;
  const r = rng(seed);
  const verts = [];
  const cols = [];
  const idx = [];
  const dark = 0.42;
  const pale = 1.05;
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * TAU;
    const cx = Math.cos(a), cz = Math.sin(a);
    const n1 = fbm(cx * 3.1 + 11.3, cz * 3.1 + 7.7, 4);
    const n2 = fbm(cx * 8.7 + 41.0, cz * 8.7 + 23.0, 3);
    const n3 = fbm(cx * 19.0 + 77.0, cz * 19.0 + 13.0, 2);
    let h = height * (0.16 + 0.84 * Math.pow(n1, 1.85));
    h += height * 0.34 * Math.pow(n2, 2.1);
    h += height * 0.10 * n3;
    if (h < 3) h = 3;
    const rr = radius * (0.93 + 0.14 * fbm(cx * 1.4 + 3.3, cz * 1.4 + 9.1, 2));
    verts.push(cx * rr, -140, cz * rr);
    verts.push(cx * rr, h, cz * rr);
    cols.push(dark, dark, dark);
    cols.push(pale, pale, pale);
  }
  for (let i = 0; i < segs; i++) {
    const a = i * 2, b = i * 2 + 1, c = i * 2 + 2, d = i * 2 + 3;
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.setIndex(idx);
  const mat = new THREE.MeshBasicMaterial({ color: colorHex, vertexColors: true, side: THREE.DoubleSide, fog: true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  return mesh;
}

function terrainHeight(x, z) {
  const zc = z - 2;
  const sd = sdBox(x, zc, 31, 33);
  const plateau = 1 - smoothstep(2, 48, sd);

  let h = (fbm(x * 0.0082 + 3.1, z * 0.0082 - 1.7, 5) - 0.45) * 74;
  h += (fbm(x * 0.031 - 5.0, z * 0.031 + 2.0, 4) - 0.5) * 26;
  h += (fbm(x * 0.072 + 8.3, z * 0.072 - 3.1, 3) - 0.5) * 6.5;
  h += (fbm(x * 0.105 + 1.7, z * 0.105 - 4.2, 2) - 0.5) * 3.0;
  h += smoothstep(-25, -130, z) * 30;
  h -= smoothstep(40, 140, z) * 62;
  h -= smoothstep(55, 160, Math.abs(x)) * 16;

  return lerp(h, 0, plateau);
}

const TER_SIZE = 470;

const C_GRASS_A = new THREE.Color(0x44532c);
const C_GRASS_B = new THREE.Color(0x2f3f1f);
const C_MOSS = new THREE.Color(0x4e5f2e);
const C_ROCK = new THREE.Color(0x77766d);
const C_ROCK_D = new THREE.Color(0x55544d);
const C_DIRT = new THREE.Color(0x7e7357);

const terPos = terGeo.attributes.position;
const terCount = terPos.count;
const terBase = new Float32Array(terCount * 3);
const terSnowW = new Float32Array(terCount);
const tmpCol = new THREE.Color();

for (let i = 0; i < terCount; i++) {
  const x = terPos.getX(i), z = terPos.getZ(i);
  const y = terrainHeight(x, z);
  terPos.setY(i, y);

  const e = 1.1;
  const hx = terrainHeight(x + e, z) - terrainHeight(x - e, z);
  const hz = terrainHeight(x, z + e) - terrainHeight(x, z - e);
  const slope = Math.sqrt(hx * hx + hz * hz) / (2 * e);

  const rockAmt = smoothstep(0.55, 1.35, slope);
  const g1 = fbm(x * 0.045 + 2.0, z * 0.045 - 6.0, 3);
  tmpCol.copy(C_GRASS_A).lerp(C_GRASS_B, g1);
  const mossAmt = smoothstep(0.42, 0.82, fbm(x * 0.11 + 9.0, z * 0.11 - 4.0, 3)) * (1 - rockAmt);
  tmpCol.lerp(C_MOSS, mossAmt * 0.75);
  const rockCol = C_ROCK_D.clone().lerp(C_ROCK, fbm(x * 0.2, z * 0.2, 2));
  tmpCol.lerp(rockCol, rockAmt * 0.92);

  const sd = sdBox(x, z - 2, 26, 26);
  const yard = 1 - smoothstep(1, 9, sd);
  const pathAmt = (1 - smoothstep(1.6, 4.2, Math.abs(x))) * (1 - smoothstep(30, 40, z)) * (1 - smoothstep(-8, -14, -z + 4));
  tmpCol.lerp(C_DIRT, Math.max(yard * 0.72, pathAmt * 0.5));

  const bright = 0.9 + 0.18 * fbm(x * 0.33 + 5.0, z * 0.33 + 1.0, 2);
  terBase[i * 3] = tmpCol.r * bright;
  terBase[i * 3 + 1] = tmpCol.g * bright;
  terBase[i * 3 + 2] = tmpCol.b * bright;

  terSnowW[i] = (1 - smoothstep(0.4, 1.15, slope)) * (0.55 + 0.45 * fbm(x * 0.28, z * 0.28, 2)) * (1 - yard * 0.55);
}

const MAT_RIDGE_TILE = new THREE.MeshStandardMaterial({ color: 0x2c3137, roughness: 0.68, metalness: 0.06 });
const MAT_RAFTER = new THREE.MeshStandardMaterial({ color: 0x6d4630, roughness: 0.85, metalness: 0.0 });

function mergeGeos(list) {
  let vTotal = 0, iTotal = 0;
  for (let i = 0; i < list.length; i++) {
    const g = list[i];
    vTotal += g.attributes.position.count;
    iTotal += g.index ? g.index.count : g.attributes.position.count;
  }
  const pos = new Float32Array(vTotal * 3);
  const nor = new Float32Array(vTotal * 3);
  const uv = new Float32Array(vTotal * 2);
  const idx = new (vTotal > 65535 ? Uint32Array : Uint16Array)(iTotal);
  let vo = 0, io = 0, vbase = 0;
  for (let i = 0; i < list.length; i++) {
    const g = list[i];
    const P = g.attributes.position.array;
    pos.set(P, vo * 3);
    if (g.attributes.normal) nor.set(g.attributes.normal.array, vo * 3);
    if (g.attributes.uv) uv.set(g.attributes.uv.array, vo * 2);
    const n = g.attributes.position.count;
    if (g.index) {
      const I = g.index.array;
      for (let k = 0; k < I.length; k++) idx[io + k] = I[k] + vbase;
      io += I.length;
    } else {
      for (let k = 0; k < n; k++) idx[io + k] = k + vbase;
      io += n;
    }
    vo += n;
    vbase += n;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  out.computeBoundingSphere();
  return out;
}

function addBox(parent, w, h, d, mat, x, y, z, ry) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  if (ry) m.rotation.y = ry;
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function roofY(x, z, hw, hd, rh, rise, up) {
  const tz = clamp(Math.abs(z) / hd, 0, 1);
  const tx = clamp((Math.abs(x) - rh) / Math.max(0.001, hw - rh), 0, 1);
  const endF = 1 - Math.pow(tx, 1.06) * 0.885;
  const base = rise * Math.pow(1 - tz, 1.34) * endF;
  const corner = tx * tz;
  const lift = up * (0.15 * Math.pow(tz, 7) + 0.80 * Math.pow(corner, 4.0));
  return base + lift;
}

function roofSurface(o) {
  const hw = o.hw, hd = o.hd, rh = o.rh;
  const rise = o.rise, up = o.upturn === undefined ? 1.2 : o.upturn;
  const segX = o.segX || 86, segZ = o.segZ || 70;
  const us = o.uScale === undefined ? 0.25 : o.uScale;
  const vs = o.vScale === undefined ? 0.36 : o.vScale;
  const verts = [], uvs = [], idx = [];
  for (let j = 0; j <= segZ; j++) {
    const z = (j / segZ * 2 - 1) * hd;
    for (let i = 0; i <= segX; i++) {
      const x = (i / segX * 2 - 1) * hw;
      verts.push(x, roofY(x, z, hw, hd, rh, rise, up), z);
      uvs.push((x + hw) * us, (z + hd) * vs);
    }
  }
  for (let j = 0; j < segZ; j++) {
    for (let i = 0; i < segX; i++) {
      const a = j * (segX + 1) + i;
      const b = a + 1;
      const c = a + segX + 1;
      const d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function offsetGeometry(geo, d) {
  const g = new THREE.BufferGeometry();
  const pos = geo.attributes.position;
  const nor = geo.attributes.normal;
  const p = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    p[i * 3] = pos.getX(i) + nor.getX(i) * d;
    p[i * 3 + 1] = pos.getY(i) + nor.getY(i) * d;
    p[i * 3 + 2] = pos.getZ(i) + nor.getZ(i) * d;
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(geo.attributes.uv.array.slice(0), 2));
  g.setIndex(new THREE.BufferAttribute(geo.index.array.slice(0), 1));
  g.computeVertexNormals();
  return g;
}

function perimeterPts(o, per) {
  const pts = [];
  const hw = o.hw, hd = o.hd, rh = o.rh, rise = o.rise;
  const up = o.upturn === undefined ? 1.2 : o.upturn;
  const n = per || 26;
  let i;
  for (i = 0; i < n; i++) {
    const x = -hw + (2 * hw) * (i / n);
    pts.push(new THREE.Vector3(x, roofY(x, hd, hw, hd, rh, rise, up), hd));
  }
  for (i = 0; i < n; i++) {
    const z = hd - (2 * hd) * (i / n);
    pts.push(new THREE.Vector3(hw, roofY(hw, z, hw, hd, rh, rise, up), z));
  }
  for (i = 0; i < n; i++) {
    const x = hw - (2 * hw) * (i / n);
    pts.push(new THREE.Vector3(x, roofY(x, -hd, hw, hd, rh, rise, up), -hd));
  }
  for (i = 0; i < n; i++) {
    const z = -hd + (2 * hd) * (i / n);
    pts.push(new THREE.Vector3(-hw, roofY(-hw, z, hw, hd, rh, rise, up), z));
  }
  return pts;
}

const snowShells = [];

function buildRoof(o) {
  const group = new THREE.Group();
  const geo = roofSurface(o);
  const mesh = new THREE.Mesh(geo, o.mat || MAT.roof);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);

  const snowGeo = offsetGeometry(geo, 0.075);
  const snowMesh = new THREE.Mesh(snowGeo, MAT.snow);
  snowMesh.visible = false;
  snowMesh.receiveShadow = true;
  group.add(snowMesh);
  snowShells.push(snowMesh);

  const per = o.perSeg || 22;
  const pts = perimeterPts(o, per);
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.28);
  const fascia = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 210, o.fasciaR || 0.125, 6, true),
    o.fasciaMat || MAT.beam
  );
  fascia.castShadow = true;
  group.add(fascia);

  /* 처마 끝 개판 — 지붕에 두께를 준다 */
  const skirtH = o.skirt === false ? 0 : (o.skirtH || 0.24);
  if (skirtH > 0) {
    const pts2 = perimeterPts(o, per);
    const sv = [];
    const si = [];
    const n2 = pts2.length;
    for (let i = 0; i < n2; i++) {
      const p = pts2[i];
      sv.push(p.x, p.y + 0.01, p.z);
      sv.push(p.x, p.y - skirtH, p.z);
    }
    for (let i = 0; i < n2; i++) {
      const a = i * 2, b = i * 2 + 1;
      const c = ((i + 1) % n2) * 2, d = c + 1;
      si.push(a, b, c, b, d, c);
      si.push(a, c, b, b, c, d);
    }
    const sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.Float32BufferAttribute(sv, 3));
    sg.setIndex(si);
    sg.computeVertexNormals();
    const skirt = new THREE.Mesh(sg, o.fasciaMat || MAT.beam);
    skirt.castShadow = true;
    group.add(skirt);
  }

  if (o.rafters !== false) {
    const dummy = new THREE.Object3D();
    const raftGeo = new THREE.CylinderGeometry(0.062, 0.085, 1, 6, 1);
    const count = pts.length;
    const inst = new THREE.InstancedMesh(raftGeo, o.rafterMat || MAT_RAFTER, count);
    inst.castShadow = true;
    inst.receiveShadow = true;
    const a = new THREE.Vector3(), b = new THREE.Vector3(), dir = new THREE.Vector3();
    const upV = new THREE.Vector3(0, 1, 0);
    for (let i = 0; i < count; i++) {
      const p = pts[i];
      const ox = p.x / (o.hw * o.hw), oz = p.z / (o.hd * o.hd);
      const len = Math.sqrt(ox * ox + oz * oz) || 1;
      const inner = new THREE.Vector3(p.x - ox / len * 2.05, 0, p.z - oz / len * 2.05);
      inner.y = roofY(inner.x, inner.z, o.hw, o.hd, o.rh, o.rise, o.upturn === undefined ? 1.2 : o.upturn) - 0.34;
      a.copy(inner);
      b.set(p.x, p.y - 0.26, p.z);
      dir.subVectors(b, a);
      const L = dir.length();
      dummy.position.copy(a).addScaledVector(dir, 0.5);
      dummy.quaternion.setFromUnitVectors(upV, dir.normalize());
      dummy.scale.set(1, L, 1);
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
    group.add(inst);
  }

  const rh = o.rh, rise = o.rise;
  const ridgeLen = Math.max(0.6, 2 * rh * 1.02);
  addBox(group, ridgeLen, 0.40, 0.66, MAT.ridgeWhite, 0, rise - 0.06, 0);
  addBox(group, ridgeLen + 0.42, 0.14, 0.80, MAT_RIDGE_TILE, 0, rise + 0.16, 0);
  addBox(group, 0.30, 0.46, 0.72, MAT_RIDGE_TILE, ridgeLen / 2 + 0.08, rise + 0.16, 0);
  addBox(group, 0.30, 0.46, 0.72, MAT_RIDGE_TILE, -ridgeLen / 2 - 0.08, rise + 0.16, 0);

  for (let sx = -1; sx <= 1; sx += 2) {
    for (let sz = -1; sz <= 1; sz += 2) {
      const hp = [];
      for (let k = 0; k <= 14; k++) {
        const t = k / 14;
        const x = sx * (rh + (o.hw - rh) * t);
        const z = sz * o.hd * t * 0.995;
        hp.push(new THREE.Vector3(x, roofY(x, z, o.hw, o.hd, o.rh, o.rise, o.upturn === undefined ? 1.2 : o.upturn) + 0.04, z));
      }
      const hc = new THREE.CatmullRomCurve3(hp, false, 'catmullrom', 0.3);
      const hm = new THREE.Mesh(new THREE.TubeGeometry(hc, 26, 0.115, 5, false), MAT.ridgeWhite);
      hm.castShadow = true;
      group.add(hm);
    }
  }

  group.position.set(o.x || 0, o.y || 0, o.z || 0);
  if (o.ry) group.rotation.y = o.ry;
  return group;
}

/* ---------------- 배흘림 기둥 ---------------- */

function latticeColumnGeo(radius, height, segs) {
  const pts = [];
  const n = 14;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const r = radius * (1.0 - 0.11 * t + 0.09 * Math.sin(Math.PI * t));
    pts.push(new THREE.Vector2(r, t * height));
  }
  return new THREE.LatheGeometry(pts, segs || 16);
}

/* 향 연기 */
function buildIncenseSmoke() {
  const N = 64;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const t = i / N;
    pos[i * 3] = (Math.sin(i * 1.7) * 0.09);
    pos[i * 3 + 1] = t * 1.9;
    pos[i * 3 + 2] = (Math.cos(i * 2.3) * 0.09);
    smokeSeed.push({ t: t, sp: 0.30 + (i % 7) * 0.028, ph: i * 0.9 });
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  smokeGeo = geo;
  const mat = new THREE.PointsMaterial({
    color: 0xdfe6ea, size: 0.42, map: TX.dot, transparent: true, opacity: 0.16,
    sizeAttenuation: true, depthWrite: false, blending: THREE.NormalBlending
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  return pts;
}

function buildWallRunUnused() {}
function buildWalls() {
  const H = 1.75;

  wallRun(25, -22, 25, 23, H);
  wallRun(-25, 23, -3.9, 23, H);

  wallRun(-19, -22, 19, -22, H);
  return makeWallMeshes();

const wallBlocks = [];

function wallRun(x1, z1, x2, z2, h) {
  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.sqrt(dx * dx + dz * dz);
  const ang = Math.atan2(dx, dz);
  const n = Math.max(1, Math.round(len / 2.2));
  const stepL = len / n;
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n;
    const x = x1 + dx * t, z = z1 + dz * t;
    const hh = h * (0.94 + 0.12 * hash2(i * 3.1, x * 0.7));
    const y0 = terrainHeight(x, z);
    const w = stepL + 0.06;
    wallBlocks.push({ x: x, y: y0 + hh / 2, z: z, ry: ang, w: 0.62, h: hh, d: w, k: 0 });
    wallBlocks.push({ x: x, y: y0 + hh + 0.07, z: z, ry: ang, w: 0.94, h: 0.14, d: w + 0.08, k: 1 });
    wallBlocks.push({ x: x, y: y0 + hh + 0.19, z: z, ry: ang, w: 0.68, h: 0.10, d: w + 0.02, k: 2 });
  }
}

function makeWallMeshes() {
  const g = new THREE.Group();
  const mats = [MAT.wall, MAT.wallCap, MAT.graniteDark];
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  const dm = new THREE.Object3D();
  for (let k = 0; k < 3; k++) {
    const list = [];
    for (let i = 0; i < wallBlocks.length; i++) if (wallBlocks[i].k === k) list.push(wallBlocks[i]);
    if (!list.length) continue;
    const inst = new THREE.InstancedMesh(boxGeo, mats[k], list.length);
    for (let i = 0; i < list.length; i++) {
      const b = list[i];
      dm.position.set(b.x, b.y, b.z);
      dm.rotation.set(0, b.ry, 0);
      dm.scale.set(b.w, b.h, b.d);
      dm.updateMatrix();
      inst.setMatrixAt(i, dm.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
    inst.castShadow = true;
    inst.receiveShadow = true;
    g.add(inst);
  }
  return g;
}

function buildPath() {
  const g = new THREE.Group();

  const n = 34;
  for (let i = 0; i < n; i++) {
    const z = 34 - i * 1.12;
    if (z < -4) break;
    const w = 1.05 + hash2(i * 1.7, 3.3) * 0.35;
    const y = terrainHeight(0, z);
    slabs.push({ y: y + 0.07, z: z, w: w, ry: (hash2(i, 7.1) - 0.5) * 0.05 });
  }
  const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(2.7, 0.14, 1), MAT.granite, slabs.length);
  const dm = new THREE.Object3D();
  for (let i = 0; i < slabs.length; i++) {
    const s = slabs[i];
    dm.position.set(0, s.y, s.z);
    dm.rotation.set(0, s.ry, 0);
    dm.scale.set(1, 1, s.w);

  inst.instanceMatrix.needsUpdate = true;
  inst.castShadow = true;
  inst.receiveShadow = true;

function taperedTube(curve, segs, radial, radiusFn) {
  const frames = curve.computeFrenetFrames(segs, false);
  const pos = [], nor = [], uv = [], idx = [];
  const P = new THREE.Vector3(), N = new THREE.Vector3(), B = new THREE.Vector3();
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    curve.getPointAt(t, P);
    const nvec = frames.normals[i], bvec = frames.binormals[i];
    if (nvec) { N.copy(nvec); B.copy(bvec); }
    const r = Math.max(0.008, radiusFn(t));
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * TAU;
      const ca = Math.cos(a), sa = Math.sin(a);
      const nx = N.x * ca + B.x * sa;
      const ny = N.y * ca + B.y * sa;
      const nz = N.z * ca + B.z * sa;
      pos.push(P.x + nx * r, P.y + ny * r, P.z + nz * r);
      nor.push(nx, ny, nz);
      uv.push(t * 3, j / radial);
    }
  }
  for (let i = 0; i < segs; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j;
      const b = a + 1;
      const c = a + radial + 1;
      const d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

function clumpGeo(detail, seed, squash) {
  const g = new THREE.IcosahedronGeometry(1, detail);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const n = 0.74 + 0.46 * vnoise(x * 1.9 + seed, z * 1.9 + y * 2.2 + seed * 0.7);
    p.setXYZ(i, x * n, y * n * squash, z * n);
  }
  g.computeVertexNormals();
  return g;
}

MAT.pine.color.setHex(0xffffff);
MAT.pineDeep.color.setHex(0xffffff);

const pinePads = [];
const maplePads = [];

function buildPine(x, z, scale, seed) {
  const r = rng(seed);
  const g = new THREE.Group();
  g.name = 'pine';
  const y0 = terrainHeight(x, z) - 0.25;
  g.position.set(x, y0, z);
  const parts = [];

  const H = (5.4 + r() * 2.4) * scale;
  const lean = (r() - 0.5) * 2.0 * scale;
  const sway = (r() - 0.5) * 1.4 * scale;
  const pts = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(lean * 0.12, H * 0.30, sway * 0.2),
    new THREE.Vector3(lean * 0.45, H * 0.60, sway * 0.6),
    new THREE.Vector3(lean * 0.85, H * 0.86, sway * 0.9),
    new THREE.Vector3(lean * 1.0, H, sway * 1.0)
  ];
  const curve = new THREE.CatmullRomCurve3(pts);
  parts.push(taperedTube(curve, 20, 8, function (t) {
    return (0.30 - 0.19 * t + 0.045 * Math.sin(t * Math.PI * 3)) * scale;
  }));

  const world = new THREE.Vector3();

  function padAt(p, s, tiltAmt) {
    world.copy(p);
    world.x += x * 0 + 0;
    pinePads.push({
      pos: new THREE.Vector3(p.x + x, p.y + y0, p.z + z),
      s: s,
      rot: r() * TAU,
      tilt: (r() - 0.5) * (tiltAmt || 0.7),
      col: r() < 0.45 ? 0x2a4021 : (r() < 0.6 ? 0x1f331a : 0x35502a)
    });
  }

  const nb = 4 + Math.floor(r() * 3);
  for (let i = 0; i < nb; i++) {
    const t = 0.34 + 0.56 * (i / nb) + r() * 0.06;
    const p0 = curve.getPointAt(clamp(t, 0, 1)).clone();
    const ang = r() * TAU;
    const len = (1.5 + r() * 1.9) * scale;
    const up = (0.25 + r() * 0.85) * scale;
    const p1 = new THREE.Vector3(
      p0.x + Math.cos(ang) * len * 0.45,
      p0.y + up * 0.45,
      p0.z + Math.sin(ang) * len * 0.45
    );
    const p2 = new THREE.Vector3(
      p0.x + Math.cos(ang) * len,
      p0.y + up,
      p0.z + Math.sin(ang) * len
    );
    const bc = new THREE.CatmullRomCurve3([p0, p1, p2]);
    parts.push(taperedTube(bc, 8, 6, function (u) {
      return (0.10 * (1 - u) + 0.02) * scale;
    }));

    const pads = 3 + Math.floor(r() * 2);
    for (let k = 0; k < pads; k++) {
      const u = 0.52 + k * 0.24;
      const q = bc.getPointAt(clamp(u, 0, 1)).clone();
      padAt(
        new THREE.Vector3(q.x + (r() - 0.5) * 0.5 * scale, q.y + (0.16 + r() * 0.2) * scale, q.z + (r() - 0.5) * 0.5 * scale),
        (0.52 + r() * 0.42) * scale * (1.12 - k * 0.14)
      );
    }
  }
  /* 꼭대기 잎 */
  const topPt = curve.getPointAt(1).clone();
  padAt(new THREE.Vector3(topPt.x, topPt.y + 0.2 * scale, topPt.z), (0.85 + r() * 0.3) * scale, 0.4);

  const trunkMesh = new THREE.Mesh(mergeGeos(parts), MAT.bark);
  trunkMesh.castShadow = true;
  trunkMesh.receiveShadow = true;
  g.add(trunkMesh);

  return g;
}

function buildMaple(x, z, scale, seed) {
  const r = rng(seed);
  const g = new THREE.Group();
  g.name = 'maple';
  const y0 = terrainHeight(x, z) - 0.2;
  g.position.set(x, y0, z);
  const parts = [];

  const H = (3.0 + r() * 1.4) * scale;
  const pts = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3((r() - 0.5) * 0.6 * scale, H * 0.42, (r() - 0.5) * 0.6 * scale),
    new THREE.Vector3((r() - 0.5) * 1.0 * scale, H * 0.78, (r() - 0.5) * 1.0 * scale),
    new THREE.Vector3((r() - 0.5) * 1.2 * scale, H, (r() - 0.5) * 1.2 * scale)
  ];
  const curve = new THREE.CatmullRomCurve3(pts);
  parts.push(taperedTube(curve, 14, 7, function (t) {
    return (0.26 - 0.17 * t) * scale;
  }));

  const palette = [0xc0392b, 0xd35400, 0xe08234, 0xa62b1c, 0xc9472e, 0xdd9b33];

  const nb = 5 + Math.floor(r() * 3);
  for (let i = 0; i < nb; i++) {
    const t = 0.4 + 0.55 * (i / nb) + r() * 0.05;
    const p0 = curve.getPointAt(clamp(t, 0, 1)).clone();
    const ang = r() * TAU;
    const len = (1.1 + r() * 1.5) * scale;
    const up = (0.5 + r() * 1.0) * scale;
    const p1 = new THREE.Vector3(p0.x + Math.cos(ang) * len * 0.5, p0.y + up * 0.55, p0.z + Math.sin(ang) * len * 0.5);
    const p2 = new THREE.Vector3(p0.x + Math.cos(ang) * len, p0.y + up, p0.z + Math.sin(ang) * len);
    const bc = new THREE.CatmullRomCurve3([p0, p1, p2]);
    parts.push(taperedTube(bc, 7, 5, function (u) {
      return (0.07 * (1 - u) + 0.018) * scale;
    }));

    const pads = 3;
    for (let k = 0; k < pads; k++) {
      const u = 0.45 + k * 0.28;
      const q = bc.getPointAt(clamp(u, 0, 1)).clone();
      maplePads.push({
        pos: new THREE.Vector3(q.x + x + (r() - 0.5) * 0.55 * scale, q.y + y0 + (0.2 + r() * 0.25) * scale, q.z + z + (r() - 0.5) * 0.55 * scale),
        s: (0.52 + r() * 0.42) * scale,
        rot: r() * TAU,
        tilt: (r() - 0.5) * 0.6,
        col: palette[Math.floor(r() * palette.length)]
      });
    }
  }
  const tp = curve.getPointAt(1).clone();
  maplePads.push({
    pos: new THREE.Vector3(tp.x + x, tp.y + y0 + 0.28 * scale, tp.z + z),
    s: (0.66 + r() * 0.3) * scale,
    rot: r() * TAU,
    tilt: 0,
    col: palette[Math.floor(r() * palette.length)]
  });

  const trunkMesh = new THREE.Mesh(mergeGeos(parts), MAT.bark);
  trunkMesh.castShadow = true;
  trunkMesh.receiveShadow = true;
  g.add(trunkMesh);

  return g;
}

function buildRock(x, z, scale, seed, mossy) {
  const r = rng(seed);
  const geo = new THREE.IcosahedronGeometry(1, 1);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i);
    const n = 0.66 + 0.6 * vnoise(vx * 2.1 + seed, vz * 2.1 + vy * 1.7);
    p.setXYZ(i, vx * n * 1.15, vy * n * 0.72, vz * n * 1.05);
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mossy ? MAT.mossRock : MAT.rock);
  m.scale.setScalar(scale);
  m.position.set(x, terrainHeight(x, z) + scale * 0.18, z);
  m.rotation.set((r() - 0.5) * 0.3, r() * TAU, (r() - 0.5) * 0.3);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function makeFoliage(list, geo, mat) {
  if (!list.length) return null;
  const mesh = new THREE.InstancedMesh(geo, mat, list.length);
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  for (let i = 0; i < list.length; i++) {
    const f = list[i];
    dummy.position.copy(f.pos);
    dummy.rotation.set(f.tilt || 0, f.rot, 0);
    dummy.scale.set(f.s * 1.25, f.s, f.s * 1.2);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    col.setHex(f.col);
    mesh.setColorAt(i, col);
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function copyPreset(p, dst) {
  dst.skyTop.setHex(p.skyTop);
  dst.skyMid.setHex(p.skyMid);
  dst.skyBot.setHex(p.skyBot);
  dst.sunColor.setHex(p.sunColor);

  dst.star = p.star;

let skyMoving = false;
const paintedTop = new THREE.Color();
const paintedMid = new THREE.Color();
const paintedBot = new THREE.Color();

function skyNeedsPaint() {
  const d = Math.abs(cur.skyTop.r - paintedTop.r) + Math.abs(cur.skyTop.g - paintedTop.g) +
            Math.abs(cur.skyMid.r - paintedMid.r) + Math.abs(cur.skyMid.g - paintedMid.g) +
            Math.abs(cur.skyBot.r - paintedBot.r) + Math.abs(cur.skyBot.g - paintedBot.g);
  return d > 0.004;
}

function stepLook(dt) {
  const k = Math.min(1, dt * 3.6);

  cur.skyTop.lerp(to.skyTop, k);
  cur.skyMid.lerp(to.skyMid, k);
  cur.skyBot.lerp(to.skyBot, k);
  cur.sunColor.lerp(to.sunColor, k);
  cur.sunDir.lerp(to.sunDir, k).normalize();
  cur.sunInt = lerp(cur.sunInt, to.sunInt, k);
  cur.hemiSky.lerp(to.hemiSky, k);
  cur.hemiGround.lerp(to.hemiGround, k);
  cur.hemiInt = lerp(cur.hemiInt, to.hemiInt, k);
  cur.ambInt = lerp(cur.ambInt, to.ambInt, k);
  cur.fogColor.lerp(to.fogColor, k);
  cur.fogDensity = lerp(cur.fogDensity, to.fogDensity, k);
  for (let i = 0; i < 4; i++) cur.ridge[i].lerp(to.ridge[i], k);
  cur.window = lerp(cur.window, to.window, k);
  cur.lantern = lerp(cur.lantern, to.lantern, k);
  cur.star = lerp(cur.star, to.star, k);
  cur.glow = lerp(cur.glow, to.glow, k);
  cur.exposure = lerp(cur.exposure, to.exposure, k);

  return true;
}

function applyLook() {
  if (skyMoving || skyNeedsPaint()) {
    paintSky(cur.skyTop, cur.skyMid, cur.skyBot);
    paintedTop.copy(cur.skyTop);
    paintedMid.copy(cur.skyMid);
    paintedBot.copy(cur.skyBot);
    skyMoving = true;
  }

  scene.fog.color.copy(cur.fogColor);
  scene.fog.density = cur.fogDensity;

  sun.color.copy(cur.sunColor);
  sun.intensity = cur.sunInt;
  sun.position.set(cur.sunDir.x * 130, cur.sunDir.y * 130 + 4, cur.sunDir.z * 130 - 4);

  MAT.lattice.emissiveIntensity = cur.window;
  MAT.doorLeaf.emissiveIntensity = 0.06 + cur.window * 0.5;

}

function stepSnow(dt) {
  const prev = snowAmount;
  snowAmount = lerp(snowAmount, snowTarget, Math.min(1, dt * 1.9));
  if (Math.abs(snowAmount - prev) > 0.0008) {
    snowAccum += dt;
    applySnow();
    if (snowAccum > 0.06) {
      snowAccum = 0;
      updateTerrainSnow(snowAmount);
    }
  }
}

const DOOR_ANCHOR = new THREE.Vector3(0, 2.95, -8.4);
const INSIDE_POS = new THREE.Vector3(0, 2.95, -10.0);
const INSIDE_TGT = new THREE.Vector3(0, 3.0, -15.7);
const camTmp = new THREE.Vector3();
let mode = 'yard';
let doorOpen = 0;
let enterCooldown = 0;
let indoorFade = 1;
let prevDoorDist = 1e9;

const flight = {
  active: false, kind: 'inside', t: 0, dur: 2.9,
  p0: new THREE.Vector3(), p1: new THREE.Vector3(), p2: new THREE.Vector3(),
  q0: new THREE.Vector3(), q1: new THREE.Vector3(), q2: new THREE.Vector3()
};

function updateViewBtn() {
  const b = document.getElementById('insideBtn');
  if (!b) return;
  b.textContent = (mode === 'inside') ? '🏯 마당' : '🚪 법당 안';
}

function setMode(m) {
  if (mode === m) return;
  mode = m;
  if (m === 'inside') {
    controls.minDistance = 0.8;
    controls.maxDistance = 8.4;
    controls.minPolarAngle = 0.06;
    controls.maxPolarAngle = Math.PI * 0.84;
    controls.rotateSpeed = 0.48;
    controls.zoomSpeed = 0.55;
  } else {
    controls.minDistance = 0.8;
    controls.maxDistance = 105;
    controls.minPolarAngle = 0.16;
    controls.maxPolarAngle = Math.PI * 0.492;
    controls.rotateSpeed = 0.62;
    controls.zoomSpeed = 0.75;
    enterCooldown = 1.8;
  }
  updateViewBtn();
}

function flyTo(kind) {
  if (flight.active) return;
  flight.active = true;
  flight.kind = kind;
  flight.t = 0;
  flight.dur = (kind === 'inside') ? 2.9 : 2.5;
  flight.p0.copy(camera.position);
  flight.q0.copy(controls.target);
  if (kind === 'inside') {
    flight.p1.set(0, 4.6, -2.4);
    flight.p2.copy(INSIDE_POS);
    flight.q1.set(0, 3.6, -10.0);
    flight.q2.copy(INSIDE_TGT);
  } else {
    flight.p1.set(0, 4.2, -6.4);
    flight.p2.copy(homeVec());
    flight.q1.set(0, 3.4, -8.8);
    flight.q2.copy(HOME_TGT);
  }
  controls.autoRotate = false;
  controls.enabled = false;
  showHint(kind === 'inside' ? '문이 열리고 법당 안으로 들어갑니다' : '마당으로 나갑니다', 2600);
}

function stepFlight(dt) {
  flight.t += dt / flight.dur;
  const t = clamp(flight.t, 0, 1);
  const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const a = (1 - e) * (1 - e), b = 2 * (1 - e) * e, c = e * e;
  camera.position.set(
    a * flight.p0.x + b * flight.p1.x + c * flight.p2.x,
    a * flight.p0.y + b * flight.p1.y + c * flight.p2.y,
    a * flight.p0.z + b * flight.p1.z + c * flight.p2.z
  );
  camTmp.set(
    a * flight.q0.x + b * flight.q1.x + c * flight.q2.x,
    a * flight.q0.y + b * flight.q1.y + c * flight.q2.y,
    a * flight.q0.z + b * flight.q1.z + c * flight.q2.z
  );
  controls.target.copy(camTmp);
  camera.lookAt(camTmp);
  if (flight.t >= 1) {
    flight.active = false;
    camera.position.copy(flight.p2);
    controls.target.copy(flight.q2);
    setMode(flight.kind === 'inside' ? 'inside' : 'yard');
    controls.enabled = true;
    controls.update();
  }
}

function stepCamera(dt) {
  if (flight.active) { stepFlight(dt); return; }
  /* 시점 초기화 중에는 자동 진입·모드 판정을 쉰다 */
  if (resetTimer > 0) { enterCooldown = 0.6; return; }
  if (enterCooldown > 0) enterCooldown -= dt;

  const p = camera.position;
  if (mode === 'yard') {
    if (p.z < -9.15 && p.z > -17.4 && Math.abs(p.x) < 7.0 && p.y > 1.1) {
      setMode('inside');
    } else {
      /* 문 쪽으로 다가가면 시선 중심을 문으로 당겨 준다 */
      const d = p.distanceTo(DOOR_ANCHOR);
      const k = smoothstep(15, 3.2, d);
      const g = Math.min(1, dt * 1.4);
      controls.target.x = lerp(controls.target.x, lerp(HOME_TGT.x, DOOR_ANCHOR.x, k), g);
      controls.target.y = lerp(controls.target.y, lerp(HOME_TGT.y, DOOR_ANCHOR.y, k), g);
      controls.target.z = lerp(controls.target.z, lerp(HOME_TGT.z, DOOR_ANCHOR.z, k), g);
      const approaching = d < prevDoorDist - 0.005;
      if (enterCooldown <= 0 && approaching && d < 3.4 && p.z > -9.0 && Math.abs(p.x) < 3.4 && p.y > 1.25 && p.y < 5.2) {
        flyTo('inside');
      }
      prevDoorDist = d;
    }
  } else if (p.z > -8.55) {
    setMode('yard');
  }

  if (mode === 'inside') {
    p.x = clamp(p.x, -6.85, 6.85);
    p.z = clamp(p.z, -16.9, -8.2);
    p.y = clamp(p.y, 1.78, 5.02);
    if (p.z > -9.9) {
      p.x = clamp(p.x, -1.85, 1.85);
      p.y = clamp(p.y, 1.95, 4.45);
    }
    controls.target.x = clamp(controls.target.x, -5.2, 5.2);
    controls.target.z = clamp(controls.target.z, -16.3, -10.8);
    controls.target.y = clamp(controls.target.y, 1.9, 4.8);
  } else {
    const gh = terrainHeight(p.x, p.z) + 1.05;
    if (p.y < gh) p.y = gh;
  }
}

/* 문 · 촛불 · 향 연기 */
function stepHallLife(dt) {
  const goal = (mode === 'inside' || flight.active)
    ? 1
    : clamp(smoothstep(14, 4.2, camera.position.distanceTo(DOOR_ANCHOR)), 0.06, 1);
  doorOpen = lerp(doorOpen, goal, Math.min(1, dt * 1.8));
  /* 문은 안쪽으로 열린다 — 앞 기둥과 부딪히지 않게 */
  const ang = 0.06 + 1.62 * doorOpen;
  for (let i = 0; i < doorHinges.length; i++) {
    const h = doorHinges[i];
    h.hinge.rotation.y = -h.dir * ang;
  }

  for (let i = 0; i < candleFlames.length; i++) {
    const f = candleFlames[i];
    const s = 0.88 + 0.16 * Math.sin(elapsed * 9.3 + f.phase) + 0.07 * Math.sin(elapsed * 21.7 + f.phase * 2.1);
    f.mesh.scale.set(1, s, 1);
    if (f.glow && f.glow.material) f.glow.material.opacity = 0.38 + 0.16 * Math.sin(elapsed * 7.1 + f.phase);
  }
  for (let i = 0; i < candleLights.length; i++) {
    const c = candleLights[i];
    c.light.intensity = 2.0 + 0.55 * Math.sin(elapsed * 8.1 + c.phase) + 0.28 * Math.sin(elapsed * 17.3 + c.phase);
  }
  altarLight.intensity = 2.6 + 0.5 * Math.sin(elapsed * 2.3) + cur.lantern * 0.9;

  if (smokeGeo) {
    const arr = smokeGeo.attributes.position.array;
    for (let i = 0; i < smokeSeed.length; i++) {
      const s = smokeSeed[i];
      s.t += dt * s.sp * 0.26;
      if (s.t > 1) s.t -= 1;
      const h = s.t * 2.05;
      arr[i * 3] = Math.sin(elapsed * 0.7 + s.ph) * 0.09 * s.t + Math.sin(h * 2.4 + s.ph) * 0.08;
      arr[i * 3 + 1] = h;
      arr[i * 3 + 2] = Math.cos(elapsed * 0.55 + s.ph) * 0.09 * s.t + Math.cos(h * 2.1 + s.ph) * 0.07;
    }
    smokeGeo.attributes.position.needsUpdate = true;
  }

  indoorFade = lerp(indoorFade, mode === 'inside' ? 0 : 1, Math.min(1, dt * 2.2));
}

const insideBtn = document.getElementById('insideBtn');
if (insideBtn) {
  insideBtn.addEventListener('click', function () {
    if (flight.active) return;
    if (mode === 'inside') flyTo('yard');
    else flyTo('inside');
  });
}
updateViewBtn();

/* ==================================================================
   음악 — Web Audio로 지어 내는 잔잔한 풍류 (D 펜타토닉)
   ================================================================== */

const Music = (function () {
  /* D · E · G · A · B — 한국 5음계(계면조 느낌) */
  const SCALE = [0, 2, 5, 7, 9, 12, 14, 17, 19, 21, 24];
  const ROOT = 146.83; /* D3 */
  let ctx = null, master = null, send = null, timer = 0;
  let on = false, nextPluck = 0, nextBell = 0, nextChime = 0;
  const drone = [];
  const rnd = rng(7331);

  function Ctor() {
    if (typeof window === 'undefined') return null;
    return window.AudioContext || window.webkitAudioContext || null;
  }
  function hz(semi) { return ROOT * Math.pow(2, semi / 12); }

  function makeIR(c) {
    const len = Math.max(1, Math.floor(c.sampleRate * 3.0));
    const buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = i / len;
        lp = lp * 0.74 + (Math.random() * 2 - 1) * 0.26;
        d[i] = lp * Math.pow(1 - t, 2.4) * 0.9;
      }
    }
    return buf;
  }

  function init() {
    const AC = Ctor();
    if (!AC) return false;
    if (ctx) return true;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.0001;
      master.connect(ctx.destination);
      const conv = ctx.createConvolver();
      conv.buffer = makeIR(ctx);
      const wet = ctx.createGain();
      wet.gain.value = 0.6;
      send = ctx.createGain();
      send.gain.value = 1.0;
      send.connect(conv);
      conv.connect(wet);
      wet.connect(master);
      return true;
    } catch (e) {
      ctx = null;
      return false;
    }
  }

  function pluck(freq, when, vel) {
    const c = ctx;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vel, when + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 3.4);
    const f = c.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(2400, when);
    f.frequency.exponentialRampToValueAtTime(820, when + 2.4);
    f.Q.value = 0.8;
    const o1 = c.createOscillator();
    o1.type = 'triangle';
    o1.frequency.setValueAtTime(freq * 1.04, when);
    o1.frequency.exponentialRampToValueAtTime(freq, when + 0.11);
    const o2 = c.createOscillator();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(freq * 2.01, when);
    o2.frequency.exponentialRampToValueAtTime(freq * 2, when + 0.14);
    const g2 = c.createGain();
    g2.gain.value = 0.22;
    o1.connect(f);
    o2.connect(g2);
    g2.connect(f);
    f.connect(g);
    g.connect(master);
    g.connect(send);
    o1.start(when);
    o2.start(when);
    o1.stop(when + 3.6);
    o2.stop(when + 3.6);
  }

  function bell(when, vol) {
    const c = ctx;
    const base = 96;
    const parts = [[1, 1], [2.02, 0.5], [2.98, 0.26], [4.13, 0.17], [5.44, 0.10], [6.8, 0.06]];
    for (let i = 0; i < parts.length; i++) {
      const o = c.createOscillator();
      o.type = 'sine';
      o.frequency.value = base * parts[i][0];
      const g = c.createGain();
      const peak = vol * parts[i][1] * 0.12;
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), when + 0.05 + i * 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, when + 7.5 + i * 1.2);
      o.connect(g);
      g.connect(master);
      g.connect(send);
      o.start(when);
      o.stop(when + 9 + i * 1.2);
    }
  }

  function chime(when) {
    const c = ctx;
    const base = 1180 + rnd() * 260;
    const parts = [[1, 1], [1.58, 0.5], [2.34, 0.3], [3.11, 0.16]];
    for (let i = 0; i < parts.length; i++) {
      const o = c.createOscillator();
      o.type = 'sine';
      o.frequency.value = base * parts[i][0];
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, when + i * 0.06);
      g.gain.exponentialRampToValueAtTime(0.05 * parts[i][1], when + i * 0.06 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, when + i * 0.06 + 2.6);
      o.connect(g);
      g.connect(master);
      g.connect(send);
      o.start(when);
      o.stop(when + 3);
    }
  }

  function startDrone() {
    const c = ctx, t0 = c.currentTime;
    const bus = c.createGain();
    bus.gain.setValueAtTime(0.0001, t0);
    bus.gain.exponentialRampToValueAtTime(0.32, t0 + 6);
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 520;
    lp.Q.value = 0.7;
    bus.connect(lp);
    lp.connect(master);
    lp.connect(send);
    const voices = [[-12, 'triangle', 0.22], [-5, 'sine', 0.15], [0, 'sine', 0.11], [7, 'triangle', 0.08]];
    for (let i = 0; i < voices.length; i++) {
      const v = voices[i];
      const o = c.createOscillator();
      o.type = v[1];
      o.frequency.value = hz(v[0]);
      const g = c.createGain();
      g.gain.value = v[2];
      const lfo = c.createOscillator();
      lfo.frequency.value = 0.045 + i * 0.017;
      const lg = c.createGain();
      lg.gain.value = v[2] * 0.4;
      lfo.connect(lg);
      lg.connect(g.gain);
      o.connect(g);
      g.connect(bus);
      o.start();
      lfo.start();
      drone.push(o, lfo);
    }
    /* 바람 소리 */
    const nlen = Math.max(1, Math.floor(c.sampleRate * 3));
    const nbuf = c.createBuffer(1, nlen, c.sampleRate);
    const nd = nbuf.getChannelData(0);
    let lp2 = 0;
    for (let i = 0; i < nlen; i++) {
      lp2 = lp2 * 0.92 + (Math.random() * 2 - 1) * 0.08;
      nd[i] = lp2;
    }
    const src = c.createBufferSource();
    src.buffer = nbuf;
    src.loop = true;
    const bp = c.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 760;
    bp.Q.value = 0.8;
    const ng = c.createGain();
    ng.gain.value = 0.05;
    src.connect(bp);
    bp.connect(ng);
    ng.connect(bus);
    src.start();
    drone.push(src);
  }

  function schedule() {
    if (!on || !ctx) return;
    const now = ctx.currentTime;
    if (nextPluck < now) nextPluck = now + 0.2;
    if (nextBell < now) nextBell = now + 6;
    if (nextChime < now) nextChime = now + 3;
    const horizon = now + 1.4;
    let guard = 0;
    while (nextPluck < horizon && guard++ < 8) {
      const notes = 1 + Math.floor(rnd() * 3);
      let t = nextPluck;
      for (let i = 0; i < notes; i++) {
        const semi = SCALE[Math.floor(rnd() * SCALE.length)];
        pluck(hz(semi), t, 0.085 + rnd() * 0.055);
        t += 0.24 + rnd() * 0.26;
      }
      nextPluck += 2.1 + rnd() * 3.4;
    }
    if (nextBell < horizon) { bell(nextBell, 0.9); nextBell += 34 + rnd() * 38; }
    if (nextChime < horizon) { chime(nextChime); nextChime += 17 + rnd() * 26; }
  }

  function start() {
    if (on) return true;
    if (!init()) return false;
    try {
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    } catch (e) {}
    on = true;
    const t0 = ctx.currentTime;
    nextPluck = t0 + 0.7;
    nextBell = t0 + 12;
    nextChime = t0 + 6;
    try {
      if (master.gain.cancelScheduledValues) master.gain.cancelScheduledValues(t0);
      master.gain.setValueAtTime(0.0001, t0);
      master.gain.exponentialRampToValueAtTime(0.85, t0 + 2.4);
    } catch (e) {}
    startDrone();
    schedule();
    if (timer) clearInterval(timer);
    timer = setInterval(schedule, 320);
    return true;
  }

  function stop() {
    if (!on) return;
    on = false;
    if (timer) { clearInterval(timer); timer = 0; }
    if (!ctx) return;
    const t0 = ctx.currentTime;
    try {
      if (master.gain.cancelScheduledValues) master.gain.cancelScheduledValues(t0);
      master.gain.setValueAtTime(Math.max(0.0001, master.gain.value || 0.0001), t0);
      master.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.4);
    } catch (e) {}
    const dying = drone.slice(0);
    drone.length = 0;
    setTimeout(function () {
      for (let i = 0; i < dying.length; i++) {
        try { dying[i].stop(); } catch (e) {}
      }
      try { if (ctx && !on && ctx.state === 'running' && ctx.suspend) ctx.suspend(); } catch (e) {}
    }, 1700);
  }

  return {
    toggle: function () { if (on) { stop(); return false; } return start(); },
    isOn: function () { return on; },
    supported: function () { return !!Ctor(); }
  };
})();

const musicBtn = document.getElementById('musicBtn');
function updateMusicBtn() {
  if (!musicBtn) return;
  const on = Music.isOn();
  musicBtn.textContent = on ? '🎵 음악 켜짐' : '🎵 음악';
  if (on) musicBtn.classList.add('on');
  else musicBtn.classList.remove('on');
}
if (musicBtn) {
  musicBtn.addEventListener('click', function () {
    Music.toggle();
    updateMusicBtn();
  });
}
updateMusicBtn();

/* ---------------- 초기 상태 ---------------- */

copyPreset(PRESETS.day, cur);
copyPreset(PRESETS.day, to);
skyMoving = true;
applyLook();
applySnow();
updateTerrainSnow(snowAmount);
updateSnowBtn();

/* ---------------- 루프 ---------------- */

let lastT = 0;
let elapsed = 0;

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  fitCamera();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', function () {
  setTimeout(onResize, 220);
});

function animate(now) {
  const t = (typeof now === 'number' && now > 0) ? now : performance.now();
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.06) dt = 0.06;
  if (dt < 0) dt = 0;
  elapsed += dt;

  stepLook(dt);
  applyLook();
  stepSnow(dt);

  const snowBaseOp = Math.min(0.9, snowAmount * 0.85);
  snowMat.opacity = snowBaseOp * indoorFade;
  snowfall.visible = snowAmount > 0.02 && indoorFade > 0.03;

  if (resetTimer > 0) {
    resetTimer -= dt;
    const kk = Math.min(1, dt * 4.2);
    camera.position.lerp(homeVec(), kk);
    controls.target.lerp(HOME_TGT, kk);
    if (resetTimer <= 0) {
      camera.position.copy(homeVec());
      controls.target.copy(HOME_TGT);
    }
  }

  stepCamera(dt);
  stepHallLife(dt);

  controls.update();

  if (snowfall.visible && snowMat.opacity > 0.02) {
    const p = snowGeo.attributes.position;
    const arr = p.array;
    const halfX = SNOW_BOX.x * 0.5, halfZ = SNOW_BOX.z * 0.5;
    for (let i = 0; i < SNOW_N; i++) {
      const ix = i * 3;
      arr[ix] += (snowVel[ix] + Math.sin(elapsed * 0.9 + i * 0.7) * 0.32) * dt;
      arr[ix + 1] += snowVel[ix + 1] * dt;
      arr[ix + 2] += (snowVel[ix + 2] + Math.cos(elapsed * 0.7 + i * 0.4) * 0.22) * dt;
      if (arr[ix + 1] < -1) arr[ix + 1] = SNOW_BOX.y;
      if (arr[ix] > halfX) arr[ix] -= SNOW_BOX.x;
      if (arr[ix] < -halfX) arr[ix] += SNOW_BOX.x;
      if (arr[ix + 2] > halfZ) arr[ix + 2] -= SNOW_BOX.z;
      if (arr[ix + 2] < -halfZ) arr[ix + 2] += SNOW_BOX.z;
    }
    p.needsUpdate = true;
  }

  renderer.render(scene, camera);

  const loader = document.getElementById('loader');
  if (loader && !loader.classList.contains('gone')) loader.classList.add('gone');
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
