<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9f3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="놀이터">
<meta name="description" content="우리 집 웹앱 놀이터 — 스카이 대시 3D, 3D 테트리스, 로봇 오목, 3D 산사">
<title>우리 집 놀이터</title>
<style>
  :root{
    --ink:#1f2c44;
    --ink-soft:#5d6d88;
    --blue:#3f8cff;
    --line:#e6ecf8;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ height:100%; }
  body{
    margin:0; min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(165deg,#e9f3ff 0%,#f4f1ff 48%,#fff5ea 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  [hidden]{ display:none !important; }

  /* 배경 장식 */
  .sky{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .sky i{ position:absolute; display:block; border-radius:50%; filter:blur(58px); opacity:.55; }
  .sky .b1{ width:340px; height:340px; left:-90px; top:-70px; background:#bcd9ff; }
  .sky .b2{ width:300px; height:300px; right:-80px; top:22%; background:#e2d4ff; }
  .sky .b3{ width:320px; height:320px; left:20%; bottom:-120px; background:#ffe2c8; }

  .screen{
    position:relative; z-index:1;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
  }

  /* ── 잠금 화면 ── */
  #lock{ justify-content:center; }
  .lock-card{
    width:100%; max-width:370px;
    background:rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.95);
    border-radius:30px;
    padding:26px 20px 22px;
    text-align:center;
    box-shadow:0 22px 50px rgba(41,74,132,.14);
  }
  .lock-card.err{ animation:shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    18%{ transform:translateX(-9px); }
    38%{ transform:translateX(8px); }
    58%{ transform:translateX(-6px); }
    78%{ transform:translateX(4px); }
  }
  .lock-emoji{ font-size:36px; line-height:1; }
  .lock-title{ margin:9px 0 0; font-size:23px; font-weight:800; letter-spacing:-.6px; }
  .lock-sub{ margin:6px 0 0; font-size:13.5px; color:var(--ink-soft); line-height:1.45; }

  .dots{ display:flex; justify-content:center; gap:15px; margin:20px 0 2px; }
  .dot{
    width:15px; height:15px; border-radius:50%;
    border:2px solid #c9d7ec; background:transparent;
    transition:background .14s ease, border-color .14s ease, transform .14s ease;
  }
  .dot.on{ background:var(--blue); border-color:var(--blue); transform:scale(1.1); }
  .dots.err .dot{ border-color:#ff8aa4; }
  .msg{ min-height:19px; margin:8px 0 10px; font-size:13px; font-weight:700; color:#e0557a; }

  .pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .key{
    height:62px; width:100%;
    border:1px solid var(--line); border-radius:18px;
    background:#fff; color:var(--ink);
    font-family:inherit; font-size:25px; font-weight:700;
    box-shadow:0 2px 6px rgba(41,74,132,.07);
    cursor:pointer; touch-action:manipulation;
    transition:transform .1s ease, background .12s ease;
  }
  .key:active{ background:#eef5ff; transform:scale(.96); }
  .key.gap{ background:transparent; border-color:transparent; box-shadow:none; cursor:default; pointer-events:none; }
  .key.del{ font-size:21px; color:#7b8ba6; }

  /* ── 홈 허브 ── */
  #hub{ justify-content:flex-start; }
  .hub-shell{ width:100%; max-width:900px; }
  .hub-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin:6px 2px 16px;
  }
  .hello{ margin:0 0 3px; font-size:13px; color:var(--ink-soft); letter-spacing:.2px; }
  .who{ margin:0; font-size:26px; font-weight:800; letter-spacing:-.7px; }
  .lock-btn{
    flex:0 0 auto;
    display:inline-flex; align-items:center; gap:6px;
    padding:10px 14px;
    border:1px solid var(--line); border-radius:14px;
    background:rgba(255,255,255,.92); color:#4a5c78;
    font-family:inherit; font-size:13.5px; font-weight:700;
    cursor:pointer; touch-action:manipulation;
    box-shadow:0 2px 8px rgba(41,74,132,.07);
  }
  .lock-btn:active{ transform:scale(.97); }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(232px,1fr)); gap:13px; }
  .card{
    display:flex; align-items:center; gap:14px;
    min-height:92px; padding:16px;
    background:#fff; color:inherit; text-decoration:none;
    border:1px solid rgba(255,255,255,.95); border-radius:22px;
    box-shadow:0 8px 22px rgba(41,74,132,.10);
    transition:transform .16s ease, box-shadow .16s ease;
    touch-action:manipulation;
  }
  .card:active{ transform:scale(.98); }
  @media (hover:hover){
    .card:hover{ transform:translateY(-3px); box-shadow:0 14px 30px rgba(41,74,132,.16); }
  }
  .icon{
    flex:0 0 auto; width:56px; height:56px; border-radius:18px;
    display:grid; place-items:center; font-size:29px;
    background:#f1f5fd;
  }
  .card.sky    .icon{ background:linear-gradient(145deg,#e1efff,#c4e0ff); }
  .card.tetris .icon{ background:linear-gradient(145deg,#ece7ff,#d8cfff); }
  .card.omok   .icon{ background:linear-gradient(145deg,#ddf8ee,#c4efdf); }
  .card.temple .icon{ background:linear-gradient(145deg,#e7ecff,#d3dcff); }
  .card .text{ min-width:0; }
  .name{ display:block; font-size:18.5px; font-weight:800; letter-spacing:-.35px; }
  .desc{ display:block; margin-top:3px; font-size:13px; color:var(--ink-soft); line-height:1.35; }

  .tip{
    margin:20px 4px 0; text-align:center;
    font-size:13px; color:var(--ink-soft); line-height:1.5;
  }
  .tip b{ color:#3d6fb5; font-weight:700; }

  @media (max-width:380px){
    .key{ height:56px; font-size:23px; border-radius:16px; }
    .lock-card{ padding:22px 16px 18px; }
    .who{ font-size:23px; }
    .card{ min-height:84px; padding:14px; gap:12px; }
    .icon{ width:50px; height:50px; font-size:26px; border-radius:16px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<!-- ══════════ 잠금 화면 ══════════ -->
<main id="lock" class="screen">
  <section class="lock-card" id="lockCard">
    <div class="lock-emoji" aria-hidden="true">🔒</div>
    <h1 class="lock-title">우리 집 놀이터</h1>
    <p class="lock-sub">4자리 비밀번호를 눌러 주세요</p>

    <div class="dots" id="dots" aria-live="polite" aria-label="입력한 숫자">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="msg" id="msg" role="status"></div>

    <div class="pad" id="pad">
      <button class="key" type="button" data-key="1">1</button>
      <button class="key" type="button" data-key="2">2</button>
      <button class="key" type="button" data-key="3">3</button>
      <button class="key" type="button" data-key="4">4</button>
      <button class="key" type="button" data-key="5">5</button>
      <button class="key" type="button" data-key="6">6</button>
      <button class="key" type="button" data-key="7">7</button>
      <button class="key" type="button" data-key="8">8</button>
      <button class="key" type="button" data-key="9">9</button>
      <span class="key gap" aria-hidden="true"></span>
      <button class="key" type="button" data-key="0">0</button>
      <button class="key del" type="button" id="delBtn" aria-label="한 자리 지우기">⌫</button>
    </div>
  </section>
</main>

<!-- ══════════ 홈 허브 ══════════ -->
<main id="hub" class="screen" hidden>
  <div class="hub-shell">
    <header class="hub-head">
      <div>
        <p class="hello">안녕하세요</p>
        <h1 class="who" id="who">놀이터</h1>
      </div>
      <button class="lock-btn" type="button" id="lockBtn">🔒 잠그기</button>
    </header>

    <section class="cards" aria-label="놀이 목록">
      <a class="card sky" href="./skydash.html">
        <span class="icon" aria-hidden="true">🚀</span>
        <span class="text">
          <span class="name">스카이 대시 3D</span>
          <span class="desc">하늘길 3D 달리기 · 쉬움 · 보통 · 어려움</span>
        </span>
      </a>

      <a class="card tetris" href="./tetris.html">
        <span class="icon" aria-hidden="true">🧩</span>
        <span class="text">
          <span class="name">3D 테트리스</span>
          <span class="desc">입체 블록 퍼즐</span>
        </span>
      </a>

      <a class="card omok" href="./omok.html">
        <span class="icon" aria-hidden="true">🤖</span>
        <span class="text">
          <span class="name">로봇 오목</span>
          <span class="desc">관절팔 로봇과 오목 대국</span>
        </span>
      </a>

      <a class="card temple" href="./temple.html">
        <span class="icon" aria-hidden="true">🏯</span>
        <span class="text">
          <span class="name">3D 산사</span>
          <span class="desc">눈 내리는 산사 · 법당 구경</span>
        </span>
      </a>
    </section>

    <p class="tip">💡 태블릿이나 폰에서 <b>홈 화면에 추가</b>를 하면 앱처럼 바로 켤 수 있어요.</p>
  </div>
</main>

<script>
/* ─────────────────────────────────────────────
   설정 — 여기만 고치면 됩니다.

   · 프로필(공간)마다 4자리 숫자 비밀번호를 하나씩 둡니다.
   · 비밀번호는 숫자 4자리만 쓰세요. (예: '1234')
   · 지금 값은 예시용 임시 번호입니다. 원하는 번호로 바꿔 주세요.
   · 이름과 번호 외에 다른 개인정보(생일, 전화번호 등)는 넣지 마세요.
     이 페이지는 누구나 볼 수 있는 공개 주소에 올라갑니다.
   · 이 잠금은 장난으로 눌리는 것을 막는 가벼운 잠금입니다.
     페이지 소스를 열면 번호를 볼 수 있으니, 중요한 자료 보관용은 아닙니다.
   ───────────────────────────────────────────── */
const PROFILES = [
  { key: 'dad', name: '아빠', pin: '1234' },
  { key: 'kid', name: '딸',   pin: '0000' }
];

(function () {
  'use strict';

  const STORE_KEY = 'playground.profile';   // 탭을 닫으면 사라지는 기억
  const MAX_LEN = 4;

  const lockScreen = document.getElementById('lock');
  const hubScreen  = document.getElementById('hub');
  const lockCard   = document.getElementById('lockCard');
  const dotsBox    = document.getElementById('dots');
  const dots       = Array.prototype.slice.call(dotsBox.querySelectorAll('.dot'));
  const msg        = document.getElementById('msg');
  const who        = document.getElementById('who');

  let entered = '';
  let errorTimer = null;

  function drawDots() {
    dots.forEach(function (dot, i) {
      dot.classList.toggle('on', i < entered.length);
    });
  }

  function resetDots() {
    entered = '';
    dotsBox.classList.remove('err');
    drawDots();
  }

  function showError(text) {
    clearTimeout(errorTimer);
    msg.textContent = text;
    dotsBox.classList.add('err');
    lockCard.classList.remove('err');
    void lockCard.offsetWidth;            // 애니메이션 다시 재생
    lockCard.classList.add('err');
    errorTimer = setTimeout(function () {
      resetDots();
      msg.textContent = '';
      lockCard.classList.remove('err');
    }, 900);
  }

  function findProfile(pin) {
    for (let i = 0; i < PROFILES.length; i++) {
      if (String(PROFILES[i].pin) === pin) return PROFILES[i];
    }
    return null;
  }

  function enterSpace(profile) {
    who.textContent = profile.name + '의 공간';
    document.title = profile.name + '의 공간 · 우리 집 놀이터';
    lockScreen.hidden = true;
    hubScreen.hidden = false;
    resetDots();
    msg.textContent = '';
    window.scrollTo(0, 0);
  }

  function submit() {
    const profile = findProfile(entered);
    if (profile) {
      try { sessionStorage.setItem(STORE_KEY, profile.key); } catch (e) {}
      enterSpace(profile);
    } else {
      showError('비밀번호가 맞지 않아요. 다시 눌러 주세요.');
    }
  }

  function press(digit) {
    if (dotsBox.classList.contains('err')) return;   // 오류 표시 중에는 잠깐 막기
    if (entered.length >= MAX_LEN) return;
    entered += digit;
    msg.textContent = '';
    drawDots();
    if (entered.length === MAX_LEN) {
      const filled = entered;
      setTimeout(function () {
        if (entered === filled) submit();
      }, 140);
    }
  }

  function removeOne() {
    if (dotsBox.classList.contains('err')) return;
    if (!entered.length) return;
    entered = entered.slice(0, -1);
    drawDots();
  }

  function lock() {
    try { sessionStorage.removeItem(STORE_KEY); } catch (e) {}
    hubScreen.hidden = true;
    lockScreen.hidden = false;
    document.title = '우리 집 놀이터';
    resetDots();
    msg.textContent = '';
  }

  document.getElementById('pad').addEventListener('click', function (event) {
    const btn = event.target.closest('button[data-key]');
    if (btn) press(btn.dataset.key);
  });
  document.getElementById('delBtn').addEventListener('click', removeOne);
  document.getElementById('lockBtn').addEventListener('click', lock);

  document.addEventListener('keydown', function (event) {
    if (!lockScreen.hidden) {
      if (/^[0-9]$/.test(event.key)) { press(event.key); }
      else if (event.key === 'Backspace') { event.preventDefault(); removeOne(); }
      else if (event.key === 'Enter' && entered.length === MAX_LEN) { submit(); }
    } else if (event.key === 'Escape') {
      lock();
    }
  });

  // 같은 탭에서 새로 고치거나 돌아와도 다시 묻지 않음
  let saved = null;
  try { saved = sessionStorage.getItem(STORE_KEY); } catch (e) {}
  const savedProfile = saved ? PROFILES.find(function (p) { return p.key === saved; }) : null;
  if (savedProfile) enterSpace(savedProfile);
})();
</script>
</body>
</html>
