<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 집 허브">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="우리 집 올인원 허브 — Zoe의 루틴·별 보상·놀이터, 그리고 아빠의 스레드 보드">
<title>우리 집 올인원 허브</title>
<style>
  :root{
    --ink:#1f2c44;
    --ink-soft:#61708c;
    --line:#e5ebf7;
    --blue:#3f8cff;
    --accent:#3f8cff;
    --accent-soft:#e8f1ff;
    --accent-deep:#2b6fd6;
    --star:#f5a623;
    --ok:#25a96b;
    --ok-soft:#e6f8ef;
    --card-shadow:0 8px 22px rgba(41,74,132,.10);
    --radius:22px;
  }
  body.theme-kid{
    --accent:#f2739b;
    --accent-soft:#ffe9f0;
    --accent-deep:#d94b7b;
    --card-shadow:0 8px 22px rgba(160,70,110,.13);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ height:100%; scroll-behavior:smooth; }
  body{
    margin:0; min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(170deg,#eef3ff 0%,#f6f1ff 45%,#fff6ee 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    word-break:keep-all;
  }
  body.theme-kid{ background:linear-gradient(170deg,#fff0f5 0%,#f3f0ff 46%,#eef7ff 100%); background-attachment:fixed; }
  [hidden]{ display:none !important; }
  button{ font-family:inherit; }

  .bg{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .bg i{ position:absolute; display:block; border-radius:50%; filter:blur(60px); opacity:.55; }
  .bg .b1{ width:340px; height:340px; left:-90px; top:-80px; background:#bcd9ff; }
  .bg .b2{ width:300px; height:300px; right:-90px; top:20%; background:#e2d4ff; }
  .bg .b3{ width:330px; height:330px; left:16%; bottom:-130px; background:#ffe2c8; }
  body.theme-kid .bg .b1{ background:#ffc9dc; }
  body.theme-kid .bg .b2{ background:#d9cbff; }
  body.theme-kid .bg .b3{ background:#c9e8ff; }

  .screen{
    position:relative; z-index:1;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  }
  #pick, #pin{ justify-content:center; }
  .wrap{ width:100%; max-width:1040px; }

  /* ── 프로필 선택 ── */
  .pick-shell{ width:100%; max-width:470px; }
  .pick-title{ margin:0; text-align:center; font-size:27px; font-weight:800; letter-spacing:-.8px; }
  .pick-sub{ margin:8px 0 24px; text-align:center; font-size:14px; color:var(--ink-soft); }
  .profiles{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .profile{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:11px;
    min-height:158px; padding:24px 12px;
    background:#fff; color:var(--ink);
    border:1px solid rgba(255,255,255,.95); border-radius:27px;
    box-shadow:0 10px 26px rgba(41,74,132,.11);
    cursor:pointer; touch-action:manipulation;
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .profile:active{ transform:scale(.97); }
  @media (hover:hover){ .profile:hover{ transform:translateY(-3px); box-shadow:0 16px 32px rgba(41,74,132,.17); } }
  .avatar{
    width:78px; height:78px; border-radius:50%;
    display:grid; place-items:center; font-size:40px;
    background:linear-gradient(150deg,#eaf3ff,#f7edff);
  }
  .profile:nth-child(2) .avatar{ background:linear-gradient(150deg,#e6f8ef,#eaf1ff); }
  .pname{ font-size:19px; font-weight:800; letter-spacing:-.35px; }
  .ptag{ font-size:12px; color:var(--ink-soft); margin-top:-6px; }

  /* ── 비밀번호 ── */
  .pin-shell{ width:100%; max-width:370px; }
  .back{
    display:inline-flex; align-items:center;
    margin:0 0 10px 2px; padding:8px 12px;
    border:none; border-radius:12px; background:rgba(255,255,255,.72);
    color:var(--ink-soft); font-size:13.5px; font-weight:700;
    cursor:pointer; touch-action:manipulation;
  }
  .back:active{ transform:scale(.97); }
  .lock-card{
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.95);
    border-radius:30px;
    padding:24px 20px 22px;
    text-align:center;
    box-shadow:0 22px 50px rgba(41,74,132,.14);
  }
  .lock-card.err{ animation:shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    18%{ transform:translateX(-9px); }
    38%{ transform:translateX(8px); }
    58%{ transform:translateX(-6px); }
    78%{ transform:translateX(4px); }
  }
  .lock-emoji{ font-size:34px; line-height:1; }
  .lock-title{ margin:8px 0 0; font-size:22px; font-weight:800; letter-spacing:-.6px; }
  .lock-sub{ margin:6px 0 0; font-size:13.5px; color:var(--ink-soft); line-height:1.45; }
  .dots{ display:flex; justify-content:center; gap:15px; margin:20px 0 2px; }
  .dot{
    width:15px; height:15px; border-radius:50%;
    border:2px solid #c9d7ec; background:transparent;
    transition:background .14s ease, border-color .14s ease, transform .14s ease;
  }
  .dot.on{ background:var(--blue); border-color:var(--blue); transform:scale(1.1); }
  .dots.err .dot{ border-color:#ff8aa4; }
  .msg{ min-height:19px; margin:8px 0 10px; font-size:13px; font-weight:700; color:#e0557a; }
  .pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .key{
    height:62px; width:100%;
    border:1px solid var(--line); border-radius:18px;
    background:#fff; color:var(--ink);
    font-size:25px; font-weight:700;
    box-shadow:0 2px 6px rgba(41,74,132,.07);
    cursor:pointer; touch-action:manipulation;
    transition:transform .1s ease, background .12s ease;
  }
  .key:active{ background:#eef5ff; transform:scale(.96); }
  .key.gap{ background:transparent; border-color:transparent; box-shadow:none; cursor:default; pointer-events:none; }
  .key.del{ font-size:21px; color:#7b8ba6; }
  :focus-visible{ outline:2px solid #9fc4ff; outline-offset:2px; }

  /* ── 공간 공통 ── */
  .top{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin:2px 0 18px;
  }
  .who-wrap{ display:flex; align-items:center; gap:11px; min-width:0; }
  .avatar-sm{
    flex:0 0 auto; width:48px; height:48px; border-radius:50%;
    display:grid; place-items:center; font-size:25px;
    background:#fff; box-shadow:0 4px 12px rgba(41,74,132,.12);
  }
  .hello{ margin:0 0 2px; font-size:12.5px; color:var(--ink-soft); letter-spacing:.2px; }
  .who{ margin:0; font-size:22px; font-weight:800; letter-spacing:-.7px; }
  .ghost-btn{
    flex:0 0 auto;
    display:inline-flex; align-items:center; gap:5px;
    padding:10px 13px;
    border:1px solid var(--line); border-radius:14px;
    background:rgba(255,255,255,.94); color:#4a5c78;
    font-size:13px; font-weight:700;
    cursor:pointer; touch-action:manipulation;
    box-shadow:0 2px 8px rgba(41,74,132,.07);
  }
  .ghost-btn:active{ transform:scale(.97); }

  .section{ margin:0 0 22px; }
  .sec-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 4px 10px; }
  .sec-title{ margin:0; font-size:17px; font-weight:800; letter-spacing:-.4px; }
  .sec-note{ margin:0; font-size:12.5px; color:var(--ink-soft); }

  /* ── Zoe: 별 현황 ── */
  .star-board{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:18px 20px;
    background:linear-gradient(135deg,#fff 0%,#fff7fb 100%);
    border:1px solid rgba(255,255,255,.95);
    border-radius:26px; box-shadow:var(--card-shadow);
  }
  body.theme-dad .star-board{ background:linear-gradient(135deg,#fff 0%,#f4f9ff 100%); }
  .star-total{ display:flex; align-items:baseline; gap:7px; flex:0 0 auto; }
  .star-total .n{ font-size:38px; font-weight:900; letter-spacing:-1.4px; color:#e08a00; line-height:1; }
  .star-total .u{ font-size:16px; font-weight:800; color:#c98a1c; }
  .star-side{ flex:1 1 220px; min-width:180px; }
  .star-line{ display:flex; justify-content:space-between; font-size:13px; font-weight:700; color:#57667f; margin:0 0 7px; }
  .bar{ height:11px; border-radius:99px; background:#eceff7; overflow:hidden; }
  .bar > i{ display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,#ffc766,#ff9f43); transition:width .35s ease; }

  /* ── 루틴 카드 ── */
  .routines{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:11px; }
  .routine{
    position:relative; overflow:hidden;
    display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    min-height:112px; padding:15px 15px 14px;
    background:#fff; color:var(--ink); text-align:left;
    border:2px solid #ffe3ec; border-radius:20px;
    box-shadow:0 5px 16px rgba(160,70,110,.09);
    cursor:pointer; touch-action:manipulation;
    transition:transform .13s ease, border-color .18s ease, background .18s ease;
  }
  .routine:active{ transform:scale(.97); }
  .routine .r-emoji{ font-size:27px; line-height:1; }
  .routine .r-label{ font-size:14.5px; font-weight:800; line-height:1.32; letter-spacing:-.25px; }
  .routine .r-sub{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .routine .r-check{
    position:absolute; top:12px; right:12px;
    width:26px; height:26px; border-radius:50%;
    display:grid; place-items:center;
    font-size:15px; font-weight:900; color:#fff;
    background:#f1f4fa; border:2px solid #e2e8f4;
    transition:background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .routine.done{
    background:linear-gradient(150deg,#fff8fc,#ffeef5);
    border-color:#ffb3cd;
  }
  .routine.done .r-check{ background:var(--ok); border-color:var(--ok); transform:scale(1.04); }
  .routine.done .r-label{ color:#8b5570; }
  .routine .r-star{
    position:absolute; right:14px; bottom:12px;
    font-size:12.5px; font-weight:900; color:#e08a00;
    opacity:0; transform:translateY(4px);
    transition:opacity .2s ease, transform .2s ease;
  }
  .routine.done .r-star{ opacity:1; transform:translateY(0); }
  .routine.pop{ animation:pop .34s ease; }
  @keyframes pop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.045); } 100%{ transform:scale(1); } }

  /* ── 보상 상자 ── */
  .rewards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(152px,1fr)); gap:11px; }
  .reward{
    display:flex; flex-direction:column; gap:6px;
    padding:15px; background:#fff;
    border:1px solid var(--line); border-radius:20px;
    box-shadow:0 5px 16px rgba(41,74,132,.08);
  }
  .reward .rw-emoji{ font-size:26px; line-height:1; }
  .reward .rw-name{ font-size:14.5px; font-weight:800; letter-spacing:-.25px; }
  .reward .rw-cost{ font-size:12.5px; font-weight:800; color:#d48806; }
  .reward .rw-btn{
    margin-top:6px; padding:10px 8px;
    border:none; border-radius:13px;
    background:var(--accent); color:#fff;
    font-size:13px; font-weight:800;
    cursor:pointer; touch-action:manipulation;
    transition:transform .12s ease, opacity .15s ease, background .15s ease;
  }
  .reward .rw-btn:active{ transform:scale(.97); }
  .reward .rw-btn[disabled]{ background:#e8ecf5; color:#9aa7bd; cursor:not-allowed; }
  .reward .rw-count{ font-size:11.5px; color:var(--ink-soft); font-weight:600; min-height:15px; }

  /* ── 앱 카드 ── */
  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
  .card{
    display:flex; align-items:center; gap:13px;
    min-height:88px; padding:15px;
    background:#fff; color:inherit; text-decoration:none;
    border:1px solid rgba(255,255,255,.95); border-radius:21px;
    box-shadow:var(--card-shadow);
    transition:transform .16s ease, box-shadow .16s ease;
    touch-action:manipulation;
  }
  .card:active{ transform:scale(.98); }
  @media (hover:hover){ .card:hover{ transform:translateY(-3px); box-shadow:0 14px 30px rgba(41,74,132,.16); } }
  .icon{
    flex:0 0 auto; width:54px; height:54px; border-radius:17px;
    display:grid; place-items:center; font-size:28px;
    background:#f1f5fd;
  }
  .card.sky .icon{ background:linear-gradient(145deg,#e1efff,#c4e0ff); }
  .card.tetris .icon{ background:linear-gradient(145deg,#ece7ff,#d8cfff); }
  .card.omok .icon{ background:linear-gradient(145deg,#ddf8ee,#c4efdf); }
  .card.temple .icon{ background:linear-gradient(145deg,#e7ecff,#d3dcff); }
  .card .text{ min-width:0; }
  .name{ display:block; font-size:17px; font-weight:800; letter-spacing:-.35px; }
  .desc{ display:block; margin-top:3px; font-size:12.5px; color:var(--ink-soft); line-height:1.35; }

  /* ── 스레드 보드 ── */
  .board{
    background:rgba(255,255,255,.72);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:26px; padding:16px;
    box-shadow:var(--card-shadow);
  }
  .search-wrap{ position:relative; margin:0 0 12px; }
  .search{
    width:100%; height:46px; padding:0 42px 0 40px;
    border:1px solid var(--line); border-radius:15px;
    background:#fff; color:var(--ink);
    font-size:14.5px; font-family:inherit;
    box-shadow:0 2px 8px rgba(41,74,132,.06);
  }
  .search::placeholder{ color:#a3aec2; }
  .search-ico{ position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:15px; opacity:.6; }
  .search-clear{
    position:absolute; right:7px; top:50%; transform:translateY(-50%);
    width:32px; height:32px; border:none; border-radius:50%;
    background:#eff3fa; color:#7b8ba6; font-size:14px; font-weight:800;
    cursor:pointer;
  }
  .tabs{
    display:flex; gap:7px; overflow-x:auto; padding:2px 2px 10px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto;
    display:inline-flex; align-items:center; gap:5px;
    padding:9px 13px;
    border:1px solid var(--line); border-radius:99px;
    background:#fff; color:#4f5f79;
    font-size:13px; font-weight:800; white-space:nowrap;
    cursor:pointer; touch-action:manipulation;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab .cnt{ font-size:11.5px; font-weight:800; color:#9aa7bd; }
  .tab[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tab[aria-pressed="true"] .cnt{ color:rgba(255,255,255,.82); }
  .result-line{ margin:0 3px 11px; font-size:12.5px; color:var(--ink-soft); font-weight:700; }
  .threads{ display:grid; grid-template-columns:repeat(auto-fit,minmax(272px,1fr)); gap:11px; }
  .thread{
    display:flex; flex-direction:column;
    background:#fff; border:1px solid var(--line); border-radius:19px;
    overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .thread:hover{ transform:translateY(-2px); box-shadow:0 12px 26px rgba(41,74,132,.13); border-color:#d8e3f6; }
  .t-link{
    display:flex; flex-direction:column; gap:8px; flex:1;
    padding:14px 15px 12px; color:inherit; text-decoration:none;
  }
  .t-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .t-handle{ font-size:12.5px; font-weight:800; color:#3d6fb5; letter-spacing:-.1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .t-date{ flex:0 0 auto; font-size:11.5px; font-weight:700; color:#93a0b6; }
  .t-sum{ margin:0; font-size:14px; font-weight:700; line-height:1.46; letter-spacing:-.2px; color:#25334b; }
  .t-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; padding-top:2px; }
  .t-chip{ font-size:11px; font-weight:800; color:#6d7d97; background:#f1f5fc; border-radius:99px; padding:4px 9px; }
  .t-go{ font-size:11.5px; font-weight:800; color:var(--accent-deep); white-space:nowrap; }
  .t-extra{ display:flex; flex-wrap:wrap; gap:6px; padding:0 15px 13px; }
  .t-extra a{
    font-size:11.5px; font-weight:800; color:#5b6b86; text-decoration:none;
    background:#f4f7fd; border:1px solid #e6edf9; border-radius:99px; padding:5px 10px;
  }
  .empty{
    padding:34px 16px; text-align:center; color:var(--ink-soft);
    font-size:14px; font-weight:700;
  }
  .empty span{ display:block; font-size:30px; margin-bottom:8px; }

  .foot{ margin:22px 4px 0; text-align:center; font-size:12.5px; color:var(--ink-soft); line-height:1.5; }

  /* ── 토스트 ── */
  .toast{
    position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom));
    transform:translate(-50%,16px);
    max-width:min(88vw,420px);
    padding:13px 20px;
    background:#25334b; color:#fff;
    font-size:14px; font-weight:800; line-height:1.35; text-align:center;
    border-radius:16px; box-shadow:0 12px 30px rgba(21,32,52,.28);
    opacity:0; pointer-events:none; z-index:50;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  .noscript{ margin:12px 0 0; text-align:center; font-size:13px; color:#c0456a; font-weight:700; }

  @media (max-width:640px){
    .screen{ padding-left:13px; padding-right:13px; }
    .who{ font-size:20px; }
    .star-board{ padding:16px; gap:12px; }
    .star-total .n{ font-size:33px; }
    .threads{ grid-template-columns:1fr; }
    .board{ padding:13px; border-radius:22px; }
    .routine{ min-height:104px; padding:14px; }
  }
  @media (max-width:380px){
    .key{ height:56px; font-size:23px; border-radius:16px; }
    .lock-card{ padding:20px 15px 18px; }
    .pick-title{ font-size:25px; }
    .routines{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .routine .r-label{ font-size:13.5px; }
    .card{ min-height:82px; padding:13px; gap:11px; }
    .icon{ width:48px; height:48px; font-size:25px; border-radius:15px; }
  }
  @media (min-width:768px){
    .screen{ padding-left:26px; padding-right:26px; }
    .routines{ grid-template-columns:repeat(3,minmax(0,1fr)); }
    .pick-title{ font-size:29px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
    html{ scroll-behavior:auto; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<!-- ══════════ 1. 프로필 선택 ══════════ -->
<main id="pick" class="screen">
  <div class="pick-shell">
    <h1 class="pick-title">누구세요?</h1>
    <p class="pick-sub">내 이름을 눌러 주세요</p>
    <div class="profiles" id="profileList"></div>
    <noscript><p class="noscript">이 페이지는 자바스크립트를 켜야 열립니다.</p></noscript>
  </div>
</main>

<!-- ══════════ 2. 비밀번호 ══════════ -->
<main id="pin" class="screen" hidden>
  <div class="pin-shell">
    <button class="back" type="button" id="backBtn">← 처음으로</button>
    <section class="lock-card" id="lockCard">
      <div class="lock-emoji" id="pinEmoji" aria-hidden="true">🔒</div>
      <h1 class="lock-title" id="pinName">비밀번호</h1>
      <p class="lock-sub">4자리 비밀번호를 눌러 주세요</p>

      <div class="dots" id="dots" aria-live="polite" aria-label="입력한 숫자">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <div class="msg" id="msg" role="status"></div>

      <div class="pad" id="pad">

<script>
/* ───────────── SHA-256 (2중 준비) ───────────── */
function toHex(bytes){
  let out = '';
  for (let i = 0; i < bytes.length; i++) {
    out += (bytes[i] < 16 ? '0' : '') + bytes[i].toString(16);
  }
  return out;
}

/* 브라우저 내장 SHA-256이 없는 환경(구형 브라우저, 비보안 연결)에서도
   같은 결과가 나오도록 순수 자바스크립트 구현을 함께 둡니다. */
function sha256Pure(bytes){
  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

  function rotr(x, n){ return (x >>> n) | (x << (32 - n)); }

  const len = bytes.length;
  const blocks = ((len + 8) >> 6) + 1;
  const buf = new Uint8Array(blocks * 64);
  buf.set(bytes);
  buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  const bitLen = len * 8;
  dv.setUint32(buf.length - 8, Math.floor(bitLen / 4294967296));
  dv.setUint32(buf.length - 4, bitLen >>> 0);

  const w = new Uint32Array(64);

  for (let off = 0; off < buf.length; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const a15 = w[i - 15], a2 = w[i - 2];
      const s0 = rotr(a15, 7) ^ rotr(a15, 18) ^ (a15 >>> 3);
      const s1 = rotr(a2, 17) ^ rotr(a2, 19) ^ (a2 >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }

    let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];

    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }

    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0;
    H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0;
    H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }

  let out = '';
  for (let i = 0; i < 8; i++) out += ('00000000' + H[i].toString(16)).slice(-8);
  return out;
}

function utf8Bytes(text){
  if (window.TextEncoder) return new TextEncoder().encode(text);
  const out = [];
  for (let i = 0; i < text.length; i++) {
    let code = text.charCodeAt(i);
    if (code < 0x80) out.push(code);
    else if (code < 0x800) out.push(0xc0 | (code >> 6), 0x80 | (code & 63));
    else out.push(0xe0 | (code >> 12), 0x80 | ((code >> 6) & 63), 0x80 | (code & 63));
  }
  return new Uint8Array(out);
}

async function digest(text){
  const bytes = utf8Bytes(text);
  if (window.crypto && window.crypto.subtle && window.crypto.subtle.digest && window.isSecureContext) {
    try {
      const buf = await window.crypto.subtle.digest('SHA-256', bytes);
      return toHex(new Uint8Array(buf));
    } catch (e) { /* 아래 순수 구현으로 넘어감 */ }
  }
  return sha256Pure(bytes);
}

<script>
/* ───────────── 앱 본체 ───────────── */
(function () {
  'use strict';

  /* ── 작은 도구들 ── */
  const $ = function (sel, root) { return (root || document).querySelector(sel); };

  function el(tag, className, text){
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  const WEEK = ['일','월','화','수','목','금','토'];
  function todayKey(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function prettyDate(){
    const d = new Date();
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + WEEK[d.getDay()] + '요일';
  }

  /* localStorage (사생활 보호 모드에서도 죽지 않게) */
  const Store = {
    get: function (key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null) return fallback;
        const val = JSON.parse(raw);
        return (val === null || val === undefined) ? fallback : val;
      } catch (e) { return fallback; }
    },
    set: function (key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    },
    del: function (key) {
      try { localStorage.removeItem(key); } catch (e) {}
    }
  };

  const K_STARS  = 'hub.stars';      /* 누적 별 (숫자) */
  const K_TODAY  = 'hub.today';      /* { date:'YYYY-MM-DD', done:{ id:true } } */
  const K_CLAIMS = 'hub.claims';     /* { rewardId: 횟수 } */
  const K_SESS   = 'playground.profile';

  function getStars(){
    const n = Number(Store.get(K_STARS, 0));
    return (isFinite(n) && n > 0) ? Math.floor(n) : 0;
  }
  function addStars(delta){
    const next = Math.max(0, getStars() + delta);
    Store.set(K_STARS, next);
    return next;
  }
  /* 오늘 체크 상태 — 날짜가 바뀌면 오늘 것만 새로 시작 (누적 별은 그대로) */
  function getToday(){
    const key = todayKey();
    let st = Store.get(K_TODAY, null);
    if (!st || typeof st !== 'object' || st.date !== key) {
      st = { date: key, done: {} };
      Store.set(K_TODAY, st);
    } else if (!st.done || typeof st.done !== 'object') {
      st.done = {};
      Store.set(K_TODAY, st);
    }
    return st;
  }
  function doneCount(){
    const st = getToday();
    return ROUTINES.filter(function (r) { return st.done[r.id] === true; }).length;
  }
  function getClaims(){
    const c = Store.get(K_CLAIMS, {});
    return (c && typeof c === 'object') ? c : {};
  }

  /* 토스트 */
  let toastTimer = null;
  function toast(message){
    const box = $('#toast');
    box.textContent = message;
    box.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.classList.remove('show'); }, 2100);
  }

  /* ── 화면 전환 ── */
  const screens = { pick: $('#pick'), pin: $('#pin'), space: $('#space') };
  function show(name){
    Object.keys(screens).forEach(function (k) { screens[k].hidden = (k !== name); });
    window.scrollTo(0, 0);
  }

  let current = null;
  let entered = '';
  let busy = false;
  let errorTimer = null;

  const lockCard = $('#lockCard');
  const dotsBox  = $('#dots');
  const dots     = Array.prototype.slice.call(dotsBox.querySelectorAll('.dot'));
  const msg      = $('#msg');

  /* ── 프로필 카드 ── */
  PROFILES.forEach(function (p) {
    const btn = el('button', 'profile');
    btn.type = 'button';
    const av = el('span', 'avatar', p.emoji);
    av.setAttribute('aria-hidden', 'true');
    const nm = el('span', 'pname', p.name);
    const tg = el('span', 'ptag', p.tag);
    btn.appendChild(av);
    btn.appendChild(nm);
    btn.appendChild(tg);
    btn.addEventListener('click', function () { startPin(p); });
    $('#profileList').appendChild(btn);
  });

  function drawDots(){
    dots.forEach(function (dot, i) { dot.classList.toggle('on', i < entered.length); });
  }
  function resetDots(){
    entered = '';
    dotsBox.classList.remove('err');
    drawDots();
  }
  function showError(text){
    clearTimeout(errorTimer);
    msg.textContent = text;
    dotsBox.classList.add('err');
    lockCard.classList.remove('err');
    void lockCard.offsetWidth;
    lockCard.classList.add('err');
    errorTimer = setTimeout(function () {
      resetDots();
      lockCard.classList.remove('err');
    }, 900);
  }

  function startPin(profile){
    current = profile;
    $('#pinEmoji').textContent = profile.emoji;
    $('#pinName').textContent = profile.name + ' 비밀번호';
    resetDots();
    msg.textContent = '';
    lockCard.classList.remove('err');
    show('pin');
  }

  async function submit(){
    if (busy || !current) return;
    busy = true;
    const target = current;
    const input = entered;
    let hash = '';
    try { hash = await digest(SALT + input); } catch (e) { hash = ''; }
    busy = false;
    if (hash && hash === target.pinHash) {
      try { sessionStorage.setItem(K_SESS, target.key); } catch (e) {}
      enterSpace(target);
    } else {
      showError('비밀번호가 맞지 않아요. 다시 눌러 주세요.');
    }
  }

  function press(digit){
    if (dotsBox.classList.contains('err') || busy) return;
    if (entered.length >= 4) return;
    entered += digit;
    msg.textContent = '';
    drawDots();
    if (entered.length === 4) {
      const filled = entered;
      setTimeout(function () { if (entered === filled) submit(); }, 140);
    }
  }
  function removeOne(){
    if (dotsBox.classList.contains('err') || busy) return;
    if (!entered.length) return;
    entered = entered.slice(0, -1);
    drawDots();
  }

  function goPick(){
    clearTimeout(errorTimer);
    current = null;
    try { sessionStorage.removeItem(K_SESS); } catch (e) {}
    document.body.classList.remove('theme-kid', 'theme-dad');
    document.title = '우리 집 올인원 허브';
    resetDots();
    msg.textContent = '';
    lockCard.classList.remove('err');
    show('pick');
  }

  /* ── 공통 조각 ── */
  function section(title, note, body, id){
    const sec = el('section', 'section');
    if (id) sec.id = id;
    const head = el('div', 'sec-head');
    head.appendChild(el('h2', 'sec-title', title));
    if (note) head.appendChild(el('p', 'sec-note', note));
    sec.appendChild(head);
    sec.appendChild(body);
    return sec;
  }

  function appCards(profile){
    const grid = el('div', 'cards');
    profile.apps.forEach(function (id) {
      const app = APPS[id];
      if (!app) return;
      const a = el('a', 'card ' + app.cls);
      a.href = app.href;
      const icon = el('span', 'icon', app.emoji);
      icon.setAttribute('aria-hidden', 'true');
      const text = el('span', 'text');
      text.appendChild(el('span', 'name', app.title));
      text.appendChild(el('span', 'desc', app.desc));
      a.appendChild(icon);
      a.appendChild(text);
      grid.appendChild(a);
    });
    return grid;
  }

  /* ── 별 현황 판 ── */
  function starBoard(){
    const board = el('div', 'star-board');
    const total = el('div', 'star-total');
    total.appendChild(el('span', 'n', String(getStars())));
    total.appendChild(el('span', 'u', '⭐'));
    const side = el('div', 'star-side');
    const line = el('div', 'star-line');
    line.appendChild(el('span', '', '오늘 루틴 ' + doneCount() + ' / ' + ROUTINES.length));
    line.appendChild(el('span', '', Math.round(doneCount() / ROUTINES.length * 100) + '%'));
    const bar = el('div', 'bar');
    const fill = el('i');
    fill.style.width = (doneCount() / ROUTINES.length * 100) + '%';
    bar.appendChild(fill);
    side.appendChild(line);
    side.appendChild(bar);
    board.appendChild(total);
    board.appendChild(side);
    return board;
  }

  /* ══════════ Zoe 공간 ══════════ */
  function renderKid(body){
    const profile = PROFILES.filter(function (p) { return p.space === 'kid'; })[0];

    /* 1) 오늘의 루틴 */
    const grid = el('div', 'routines');
    const st = getToday();
    ROUTINES.forEach(function (r) {
      const done = st.done[r.id] === true;
      const card = el('button', 'routine' + (done ? ' done' : ''));
      card.type = 'button';
      card.dataset.id = r.id;
      card.setAttribute('aria-pressed', done ? 'true' : 'false');
      const emoji = el('span', 'r-emoji', r.emoji);
      emoji.setAttribute('aria-hidden', 'true');
      card.appendChild(emoji);
      card.appendChild(el('span', 'r-label', r.label));
      card.appendChild(el('span', 'r-sub', r.sub));
      const check = el('span', 'r-check', '✓');
      check.setAttribute('aria-hidden', 'true');
      card.appendChild(check);
      card.appendChild(el('span', 'r-star', '+1⭐'));
      card.addEventListener('click', function () { toggleRoutine(r, card); });
      grid.appendChild(card);
    });

    body.appendChild(section('오늘의 루틴 · 등원 준비', prettyDate(), starBoard(), 'star-board'));
    body.appendChild(section('하나씩 눌러서 완료!', '완료하면 별 1개', grid));

    /* 2) 보상 상자 */
    const rg = el('div', 'rewards');
    const claims = getClaims();
    REWARDS.forEach(function (r) {
      const box = el('div', 'reward');
      box.appendChild(el('div', 'rw-emoji', r.emoji));
      box.appendChild(el('div', 'rw-name', r.name));
      box.appendChild(el('div', 'rw-cost', r.cost + '⭐'));
      const btn = el('button', 'rw-btn', '보상 받기');
      btn.type = 'button';
      const enough = getStars() >= r.cost;
      btn.disabled = !enough;
      if (!enough) btn.textContent = '별이 ' + (r.cost - getStars()) + '개 더 필요해요';
      btn.addEventListener('click', function () { claimReward(r, btn); });
      box.appendChild(btn);
      const cnt = claims[r.id] || 0;
      box.appendChild(el('div', 'rw-count', cnt ? '지금까지 ' + cnt + '번 받았어요' : '아직 받은 적 없어요'));
      rg.appendChild(box);
    });

    body.appendChild(section('별 모으기 · 보상 상자', '모은 별로 바꿔요', rg));

    /* 3) 놀이터 */
    body.appendChild(section('Zoe 놀이터', '게임 3종', appCards(profile)));
  }

  function toggleRoutine(r, card){
    const st = getToday();
    const wasDone = st.done[r.id] === true;
    if (wasDone) {
      delete st.done[r.id];
      addStars(-1);
      toast('체크를 풀었어요 · 별 1개 돌려놓기');
    } else {
      st.done[r.id] = true;
      addStars(1);
      toast('⭐ 별 1개 받았어요!');
      if (card && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        card.classList.add('pop');
        setTimeout(function () { card.classList.remove('pop'); }, 360);
      }
    }
    Store.set(K_TODAY, st);
    renderSpace(current);
    const all = doneCount() === ROUTINES.length;
    if (all && !wasDone) setTimeout(function () { toast('🎉 오늘 루틴 모두 완료!'); }, 1200);
  }

  function claimReward(r, btn){
    const stars = getStars();
    if (stars < r.cost) {
      toast('별이 ' + (r.cost - stars) + '개 더 필요해요');
      return;
    }
    Store.set(K_STARS, stars - r.cost);
    const claims = getClaims();
    claims[r.id] = (claims[r.id] || 0) + 1;
    Store.set(K_CLAIMS, claims);
    toast('🎁 ' + r.name + ' 받았어요! (별 ' + r.cost + '개 사용)');
    renderSpace(current);
  }

  /* ══════════ 라이언 공간 ══════════ */
  let boardState = { cat: 'all', q: '' };

  function renderDad(body){
    const profile = PROFILES.filter(function (p) { return p.space === 'dad'; })[0];

    /* 1) Zoe 루틴 현황 */
    const mini = el('div', 'star-board');
    const total = el('div', 'star-total');
    total.appendChild(el('span', 'n', String(getStars())));
    total.appendChild(el('span', 'u', '⭐'));
    const side = el('div', 'star-side');
    const line = el('div', 'star-line');
    line.appendChild(el('span', '', 'Zoe 오늘 루틴 ' + doneCount() + ' / ' + ROUTINES.length));
    line.appendChild(el('span', '', Math.round(doneCount() / ROUTINES.length * 100) + '%'));
    const bar = el('div', 'bar');
    const fill = el('i');
    fill.style.width = (doneCount() / ROUTINES.length * 100) + '%';
    bar.appendChild(fill);
    side.appendChild(line);
    side.appendChild(bar);
    side.appendChild(el('p', 'sec-note', prettyDate() + ' · 같은 기기 기록 기준'));
    mini.appendChild(total);
    mini.appendChild(side);
    body.appendChild(section('Zoe 루틴 현황', '누적 별 · 오늘 완료율', mini));

    /* 2) 스레드 보드 */
    const board = el('div', 'board');

    const searchWrap = el('div', 'search-wrap');
    searchWrap.appendChild(el('span', 'search-ico', '🔍'));
    const input = el('input', 'search');
    input.type = 'search';
    input.placeholder = '키워드로 찾기 (예: 대시보드, 영어, 피클)';
    input.setAttribute('aria-label', '스레드 검색');
    input.value = boardState.q;
    const clear = el('button', 'search-clear', '✕');
    clear.type = 'button';
    clear.setAttribute('aria-label', '검색어 지우기');
    clear.hidden = !boardState.q;
    searchWrap.appendChild(input);
    searchWrap.appendChild(clear);
    board.appendChild(searchWrap);

    const tabs = el('div', 'tabs');
    tabs.setAttribute('role', 'tablist');
    board.appendChild(tabs);

    const resultLine = el('p', 'result-line');
    board.appendChild(resultLine);

    const grid = el('div', 'threads');
    board.appendChild(grid);

    body.appendChild(section('스레드 북마크 보드', '최근 4일 · ' + THREADS.length + '개', board));

    /* 3) 내 놀이터 */
    body.appendChild(section('내 놀이터 & 웹앱', '게임 4종', appCards(profile)));

    input.addEventListener('input', function () {
      boardState.q = input.value;
      clear.hidden = !input.value;
      paintThreads();
    });
    clear.addEventListener('click', function () {
      boardState.q = '';
      input.value = '';
      clear.hidden = true;
      input.focus();
      paintThreads();
    });

    function countOf(cat){
      if (cat === 'all') return THREADS.length;
      return THREADS.filter(function (t) { return t.cat === cat; }).length;
    }

    function paintTabs(){
      tabs.innerHTML = '';
      CATS.forEach(function (c) {
        const b = el('button', 'tab');
        b.type = 'button';
        b.setAttribute('aria-pressed', boardState.cat === c.id ? 'true' : 'false');
        b.appendChild(el('span', '', (c.emoji ? c.emoji + ' ' : '') + c.label));
        b.appendChild(el('span', 'cnt', String(countOf(c.id))));
        b.addEventListener('click', function () {
          boardState.cat = c.id;
          paintTabs();
          paintThreads();
        });
        tabs.appendChild(b);
      });
    }

    function matches(t, terms){
      if (boardState.cat !== 'all' && t.cat !== boardState.cat) return false;
      if (!terms.length) return true;
      const hay = (t.s + ' ' + t.a + ' ' + t.group + ' ' + t.d).toLowerCase();
      return terms.every(function (w) { return hay.indexOf(w) !== -1; });
    }

    function paintThreads(){
      grid.innerHTML = '';
      const terms = boardState.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const list = THREADS.filter(function (t) { return matches(t, terms); });
      resultLine.textContent = boardState.cat === 'all' && !terms.length
        ? '전체 ' + THREADS.length + '개'
        : list.length + '개 찾음 / 전체 ' + THREADS.length + '개';

      if (!list.length) {
        const empty = el('div', 'empty');
        empty.appendChild(el('span', '', '🔎'));
        empty.appendChild(document.createTextNode('찾는 스레드가 없어요. 다른 낱말로 해 보세요.'));
        grid.appendChild(empty);
        return;
      }

      list.forEach(function (t) {
        const card = el('article', 'thread');
        const a = el('a', 't-link');
        a.href = t.u;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        const top = el('div', 't-top');
        top.appendChild(el('span', 't-handle', '@' + t.a));
        top.appendChild(el('span', 't-date', t.d));
        a.appendChild(top);
        a.appendChild(el('p', 't-sum', t.s));

        const foot = el('div', 't-foot');
        foot.appendChild(el('span', 't-chip', t.group));
        foot.appendChild(el('span', 't-go', '원문 열기 ↗'));
        a.appendChild(foot);

        card.appendChild(a);

        if (t.x && t.x.length) {
          const ex = el('div', 't-extra');
          t.x.forEach(function (link) {
            const la = el('a', '', link.t + ' ↗');
            la.href = link.u;
            la.target = '_blank';
            la.rel = 'noopener noreferrer';
            ex.appendChild(la);
          });
          card.appendChild(ex);
        }
        grid.appendChild(card);
      });
    }

    paintTabs();
    paintThreads();
  }

  /* ── 공간 그리기 ── */
  let midnightTimer = null;

  function renderSpace(profile){
    const body = $('#spaceBody');
    body.innerHTML = '';
    if (!profile) return;
    if (profile.space === 'kid') renderKid(body);
    else renderDad(body);
  }

  function enterSpace(profile){
    current = profile;
    document.body.classList.remove('theme-kid', 'theme-dad');
    document.body.classList.add('theme-' + profile.space);
    $('#spaceEmoji').textContent = profile.emoji;
    $('#spaceName').textContent = profile.name + '의 공간';
    document.title = profile.name + '의 공간 · 우리 집 허브';
    renderSpace(profile);
    resetDots();
    msg.textContent = '';
    show('space');
    clearInterval(midnightTimer);
    midnightTimer = setInterval(function () {
      if (getToday().date !== todayKey()) renderSpace(profile);
    }, 60000);
  }

  /* ── 입력 연결 ── */
  $('#pad').addEventListener('click', function (event) {
    const btn = event.target.closest('button[data-key]');
    if (btn) press(btn.dataset.key);
  });
  $('#delBtn').addEventListener('click', removeOne);
  $('#backBtn').addEventListener('click', goPick);
  $('#lockBtn').addEventListener('click', goPick);

  document.addEventListener('keydown', function (event) {
    if (!screens.pin.hidden) {
      if (/^[0-9]$/.test(event.key)) press(event.key);
      else if (event.key === 'Backspace') { event.preventDefault(); removeOne(); }
      else if (event.key === 'Escape') goPick();
    } else if (!screens.space.hidden && event.key === 'Escape') {
      goPick();
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && current && !screens.space.hidden) {
      if (getToday().date !== todayKey()) renderSpace(current);
    }
  });

  /* 같은 탭에서 새로 고쳐도 다시 묻지 않음 */
  let saved = null;
  try { saved = sessionStorage.getItem(K_SESS); } catch (e) {}
  const savedProfile = saved ? PROFILES.filter(function (p) { return p.key === saved; })[0] : null;
  if (savedProfile) enterSpace(savedProfile);
})();
</script>
</body>
</html>
